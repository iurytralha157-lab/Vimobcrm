# Docker Compose standalone only; do not use docker stack deploy.
# The reverse proxy must reach these host-loopback ports.
services:
  web:
    restart: 'unless-stopped'
    image: '${STAGING_IMAGE_PREFIX:?Set the private staging image prefix}-web-staging:${STAGING_RELEASE_SHA:?Set the full staging commit SHA}'
    environment:
      NODE_ENV: 'production'
      NEXT_PUBLIC_SUPABASE_URL: '${STAGING_SUPABASE_URL:?Set the isolated Supabase URL}'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: '${STAGING_SUPABASE_ANON_KEY:?Set the staging public key}'
      NEXT_PUBLIC_VIMOB_API_URL: '${STAGING_PUBLIC_API_URL:?Set the staging API URL}'
      NEXT_PUBLIC_SITE_URL: '${STAGING_PUBLIC_WEB_URL:?Set the staging web URL}'
      VIMOB_API_URL: 'http://vimob-staging-api:8081'
      SUPABASE_SECRET_KEY: '${STAGING_SUPABASE_SECRET_KEY:?Set the staging server only Supabase key}'
      RESEND_API_KEY: ''
      RESEND_WEBHOOK_SECRET: ''
      EMAIL_INTERNAL_SECRET: ''
    networks:
      - 'staging-internal'
    ports:
      - '127.0.0.1:${STAGING_WEB_PORT:?Set the staging loopback web port}:3000'
  api:
    restart: 'unless-stopped'
    image: '${STAGING_IMAGE_PREFIX:?Set the private staging image prefix}-api-staging:${STAGING_RELEASE_SHA:?Set the full staging commit SHA}'
    environment:
      API_ENV: 'staging'
      API_HOST: '0.0.0.0'
      API_PORT: '8081'
      API_LOG_LEVEL: 'info'
      API_CORS_ALLOWED_ORIGINS: '${STAGING_PUBLIC_WEB_URL:?Set the staging web URL}'
      API_TRUSTED_PROXY_CIDRS: '${STAGING_TRUSTED_PROXY_CIDRS:?Set only the actual proxy network CIDRs}'
      VIMOB_API_URL: '${STAGING_PUBLIC_API_URL:?Set the staging API URL}'
      NEXT_PUBLIC_SITE_URL: '${STAGING_PUBLIC_WEB_URL:?Set the staging web URL}'
      APP_PUBLIC_URL: '${STAGING_PUBLIC_WEB_URL:?Set the staging web URL}'
      SUPABASE_PROJECT_URL: '${STAGING_SUPABASE_URL:?Set the isolated Supabase URL}'
      SUPABASE_JWKS_URL: '${STAGING_SUPABASE_URL:?Set the isolated Supabase URL}/auth/v1/.well-known/jwks.json'
      SUPABASE_JWT_ISSUER: '${STAGING_SUPABASE_URL:?Set the isolated Supabase URL}/auth/v1'
      SUPABASE_JWT_AUDIENCE: 'authenticated'
      SUPABASE_SECRET_KEY: '${STAGING_SUPABASE_SECRET_KEY:?Set the staging server only Supabase key}'
      DATABASE_URL: '${STAGING_DATABASE_URL:?Set the isolated database URL}'
      DATABASE_MAX_CONNS: '4'
      DATABASE_MIN_CONNS: '0'
      DATABASE_STARTUP_RETRY_TIMEOUT: '180s'
      DATABASE_STARTUP_RETRY_INTERVAL: '5s'
      API_BACKGROUND_WORKERS_ENABLED: 'false'
      STAGE_INACTIVITY_WORKER_ENABLED: 'false'
      AUTOMATION_RUNTIME_WORKER_ENABLED: 'false'
      PROPERTY_DEVELOPMENT_RESERVATION_WORKER_ENABLED: 'false'
      PROPERTY_PUBLICATION_WORKER_ENABLED: 'false'
      GRUPO_OLX_IMPORT_REPORT_WORKER_ENABLED: 'false'
      CHAVES_NA_MAO_INTEGRATION_ENABLED: 'false'
      NOTIFICATION_DISPATCH_WORKER_ENABLED: 'false'
      ASAAS_RECONCILIATION_ENABLED: 'false'
      ASAAS_ALLOW_PRODUCTION_CHARGES: 'false'
      GOOGLE_CALENDAR_IMMEDIATE_DISPATCH_ENABLED: 'false'
      WHATSAPP_POST_FORM_FOLLOW_UP_GUARD_ENABLED: 'false'
      WHATSAPP_AI_WORKER_ENABLED: 'false'
      WHATSAPP_AI_FOLLOW_UP_WORKER_ENABLED: 'false'
      WHATSAPP_OUTBOX_WORKER_ENABLED: 'false'
      WHATSAPP_WEBHOOK_WORKER_ENABLED: 'false'
      WHATSAPP_MEDIA_WORKER_ENABLED: 'false'
      WHATSAPP_UNLINKED_RETENTION_WORKER_ENABLED: 'false'
      WHATSAPP_SESSION_SUPERVISOR_ENABLED: 'false'
      WHATSAPP_WEBHOOK_PROCESSOR_MODE: 'edge'
      WHATSAPP_WEBHOOK_ROLLOUT_SESSION_IDS: ''
      WHATSAPP_SESSION_SUPERVISOR_RECOVERY_SESSION_IDS: ''
      META_WEBHOOK_WORKER_ENABLED: 'false'
      META_CONVERSION_FEEDBACK_WORKER_ENABLED: 'false'
      META_CONVERSION_FEEDBACK_APPSECRET_PROOF_ENABLED: 'false'
      AUTOMATION_COMMAND_TOKEN: ''
      GRUPO_OLX_WEBHOOK_SECRET: ''
      EVOLUTION_GO_API_URL: ''
      EVOLUTION_GO_API_KEY: ''
      EVOLUTION_GO_IMAGE_DIGEST: ''
      EVOLUTION_GO_WEBHOOK_URL: ''
      EVOLUTION_GO_BACKEND_WEBHOOK_URL: ''
      META_APP_ID: ''
      META_APP_SECRET: ''
      META_LOGIN_CONFIG_ID: ''
      META_WEBHOOK_VERIFY_TOKEN: ''
      META_OAUTH_CALLBACK_URL: ''
      META_OAUTH_ALLOWED_ORIGINS: ''
      ASAAS_API_KEY: ''
      ASAAS_BASE_URL: 'https://api-sandbox.asaas.com/v3'
      RESEND_API_KEY: ''
      PUBLIC_SIGNUP_RECOVERY_SECRET: '${STAGING_PUBLIC_SIGNUP_RECOVERY_SECRET:?Set a dedicated staging recovery secret}'
      WEB_PUSH_VAPID_PUBLIC_KEY: '${STAGING_WEB_PUSH_VAPID_PUBLIC_KEY:?Set the isolated staging public VAPID key}'
      WEB_PUSH_VAPID_PRIVATE_KEY: '${STAGING_WEB_PUSH_VAPID_PRIVATE_KEY:?Set the isolated staging private VAPID key}'
      FCM_SERVER_KEY: ''
      FCM_PROJECT_ID: ''
      FCM_SERVICE_ACCOUNT_JSON: ''
      FCM_SERVICE_ACCOUNT_FILE: ''
      OPENAI_API_KEY: ''
      AI_AUTOREPLY_TOKEN: ''
      BILLING_EDGE_CLIENT_IP_SIGNING_SECRET: '${STAGING_BILLING_EDGE_CLIENT_IP_SIGNING_SECRET:?Set a dedicated staging billing signing secret}'
    networks:
      staging-internal:
        aliases:
          - 'vimob-staging-api'
    ports:
      - '127.0.0.1:${STAGING_API_PORT:?Set the staging loopback API port}:8081'
networks:
  staging-internal:
    driver: 'bridge'
