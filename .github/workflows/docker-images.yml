name: Evolution Go Handshake Hotfix

on:
  push:
    branches:
      - hotfix/evolution-handshake-20261103
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  EVOLUTION_IMAGE: ${{ github.repository_owner }}/vimob-evolution-go

jobs:
  evolution-hotfix:
    name: Test, build, and publish Evolution Go only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable Evolution Go image tags
        id: evolution-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.EVOLUTION_IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}

      - name: Test, build, and publish hardened Evolution Go
        id: push-evolution
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/evolution-go-hardened/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=0.7.2-vimob-handshake-hardening.4
          tags: ${{ steps.evolution-meta.outputs.tags }}
          labels: ${{ steps.evolution-meta.outputs.labels }}
          cache-from: type=gha,scope=evolution-go
          cache-to: type=gha,mode=max,scope=evolution-go

      - name: Write immutable release manifest
        shell: bash
        env:
          EVOLUTION_DIGEST: ${{ steps.push-evolution.outputs.digest }}
        run: |
          if [[ ! "$EVOLUTION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Evolution digest is missing or is not an immutable sha256 digest."
            exit 1
          fi
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg evolution "${REGISTRY}/${EVOLUTION_IMAGE}@${EVOLUTION_DIGEST}" \
            '{commit: $commit, images: {evolution: $evolution}}' > release-manifest.json
          {
            echo "## Evolution Go handshake hotfix"
            echo
            echo "Image: \`${REGISTRY}/${EVOLUTION_IMAGE}@${EVOLUTION_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: evolution-handshake-release-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30
