        Requires `team_view`. Organization admins may inspect every team in their
        organization; non-leaders also need `team_manage`, while team leaders may
        inspect only teams they lead. Counts come from immutable successful-assignment
        snapshots. `coverage` is complete for teams created at or after `completeSince`;
        older teams retain conservative partial historical coverage.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
