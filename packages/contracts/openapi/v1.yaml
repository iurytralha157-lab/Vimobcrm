      description: >-
        Returns property, page, campaign, search and daily traffic aggregates with
        session quality and lead totals. Deployments without the extended tracking
        columns return the same closed contract with empty property and search lists.
        Without dates the backend uses the current seven-day period; explicit dates
        must be supplied together and cannot span more than 366 calendar days.
