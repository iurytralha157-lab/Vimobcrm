              schema:
                $ref: "#/components/schemas/RoundRobinRuleListResponse"
    post:
      summary: Create a rule for a round-robin queue
      description: Requires distribution_manage and the current queue expectedRevision. The resulting rule includes queueRevision for the next edit.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoundRobinRuleRequest"
      responses:
        "201":
          description: Rule created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundRobinRuleResponse"
        "409":
          $ref: "#/components/responses/APIError"
        "428":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/round-robin-rules:
    get:
      summary: List rules from visible distribution queues
      description: Requires distribution_manage. Results include only queues within the caller's management scope.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
