          minLength: 1
          maxLength: 120
        memberIds:
          type: array
          maxItems: 0
          deprecated: true
          description: Legacy field retained for decoding only. Use members so every selected member has an explicit schedule.
          items:
            type: string
            format: uuid
        members:
          type: array
          maxItems: 500
          items:
            allOf:
              - $ref: "#/components/schemas/TeamMemberMutation"
              - type: object
                required: [availability]
