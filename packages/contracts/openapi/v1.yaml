        "429":
          $ref: "#/components/responses/APIError"
  /v1/public/integrations/portals/grupo-olx/leads/{token}:
    post:
      summary: Receive an authenticated Grupo OLX lead
      description: Basic auth uses the CRM-wide Grupo OLX SECRET_KEY. Path token and IP are hashed for tenant-isolated rate limiting.
      security:
        - grupoOLXWebhookBasic: []
      parameters:
        - $ref: "#/components/parameters/GrupoOLXWebhookToken"
