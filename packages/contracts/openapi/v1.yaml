          type: string
          format: uuid
        stageId:
          type: string
          format: uuid
        assignedUserId:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
          description: Optional team stored on the lead before assignment.
        importMode:
          type: boolean
          description: When true, the row requires lead_import instead of the regular lead creation permission.
        importRequestKey:
          type: string
          format: uuid
          description: Optional durable per-row key, only with importMode=true. Scoped by organization and importing actor. The same canonical input replays its receipt without repeating mutation; changed input returns lead_import_request_conflict (409). Missing receipt storage returns lead_import_idempotency_unavailable (503) before mutation. Requires the independent contact-import receipt migration.
        autoDistribute:
          type: boolean
          description: Controls the canonical distribution call. When omitted, existing creation behavior is preserved; false skips distribution and true executes it.
        roundRobinId:
          type: string
          format: uuid
          description: Active distribution queue in the current organization. Requires autoDistribute=true and distribution_manage permission.
        interestValue:
          type: string
          description: Decimal string, mirrors Postgres numeric precision.
        dealStatus:
          type: string
          enum: [open, won, lost]
          default: open
        lostReason:
          type: string
          description: Required when dealStatus is lost.
          maxLength: 300
        isOwnResource:
          type: boolean
        conversationId:
          type: string
          format: uuid
          description: Exact physical WhatsApp conversation selected by the user. Requires expectedPreviousLeadId and confirmHistoryLink; a phone match alone never attaches prior history.
        expectedPreviousLeadId:
          description: Browser-observed active lead UUID, or unlinked when the conversation had no card. Accepted only with conversationId.
          oneOf:
            - type: string
              format: uuid
            - type: string
              enum: [unlinked]
        confirmHistoryLink:
          type: boolean
          description: Explicit user confirmation to attach eligible retained history from conversationId. Required when conversationId is provided and invalid without it.
        tagIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        cargo:
          type: string
        empresa:
          type: string
        profissao:
          type: string
        endereco:
          type: string
        bairro:
          type: string
        numero:
          type: string
        cep:
          type: string
        cidade:
          type: string
        uf:
          type: string
          maxLength: 2
        rendaFamiliar:
          type: string
        faixaValorImovel:
          type: string
    CreateLeadResponse:
      type: object
      required: [data, leadId, leadVisible, reentry, distributionOutcome]
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/Lead"
            - type: "null"
          description: The final lead snapshot when readable by the actor, otherwise null. Creation can succeed after explicit or automatic assignment removes the actor's read access.
        leadId:
          type: string
          format: uuid
          description: Identifier of the successfully persisted lead, also present in limited receipts.
        leadVisible:
          type: boolean
          description: Whether data contains a lead the actor may read after the mutation. False returns a limited receipt with data null and no assignedUserName.
        reentry:
          type: boolean
          description: True when the phone matched an existing lead in the same intake scope. For importMode, the prior owner is preserved and the reentry is not redistributed. Manual reentries follow the configured queue policy and may be redistributed.
        assignedUserName:
          type: string
          description: Included only when the final lead remains readable by the actor.
        distributionOutcome:
          type: string
          enum: [assigned, already_assigned, pooled, queue_closed, queue_waiting, queue_limit_reached, queue_protected, no_matching_queue, no_available_members, skipped, reentry_preserved]
          description: Exact canonical distribution result. no_matching_queue and no_available_members mean the lead was created but remains without an automatic assignment; queue_closed, queue_waiting and pooled describe queue waiting, queue_limit_reached stops automatic retries, queue_protected preserves protected ownership; reentry_preserved means the prior owner was kept.
    QueueOperatingSchedule:
      type: object
      additionalProperties: false
      required: [version, timezone, days]
      description: Explicitly enables managed queue hours. Absent settings retain legacy behavior. Intervals are half-open; an end before start crosses midnight. Equal times require explicit all-day mode.
      properties:
        version: { type: integer, const: 1 }
        timezone: { type: string, minLength: 1, description: Valid IANA timezone }
        days:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            additionalProperties: false
            required: [day_of_week, is_active, is_all_day, start_time, end_time]
            properties:
              day_of_week: { type: integer, minimum: 0, maximum: 6 }
              is_active: { type: boolean }
              is_all_day: { type: boolean }
              start_time: { type: [string, "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
              end_time: { type: [string, "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
