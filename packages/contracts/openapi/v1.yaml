        default:
          $ref: "#/components/responses/APIError"
  /v1/contacts:
    get:
      summary: List visible contacts for CRM screens or exports
      description: Use `mode=compact` for screens and `mode=full` (or export) for complete exports. Opt in to responseMode=page for a total on empty pages. Full page responses include an exportVersion covering the filtered set; send expectedExportVersion on subsequent pages and abort on contacts_export_changed (409). Each page uses its own repeatable-read snapshot; this is not a snapshot held across browser requests. Both creation timestamps must be provided together, ordered, within five years. Text search is literal; phone-shaped searches also compare digits without formatting.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: mode
          in: query
          schema:
            type: string
            enum: [compact, full, export]
            default: compact
        - name: responseMode
          in: query
          schema:
            type: string
            enum: [page]
        - name: expectedExportVersion
          in: query
          description: SHA256 version from the first full/export page. Requires responseMode=page.
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 25
        - name: search
          in: query
          schema:
            type: string
            maxLength: 180
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
        - name: pipelineId
          in: query
          schema:
            type: string
            format: uuid
        - name: stageId
          in: query
          schema:
            type: string
            format: uuid
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: unassigned
          in: query
          schema:
            type: boolean
        - name: tagId
          in: query
          schema:
            type: string
            format: uuid
        - name: tagIds
          in: query
          description: Comma-separated tag UUIDs. A contact matches when it has any selected tag.
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
            maxLength: 4096
        - name: pageId
          in: query
          description: Exact Facebook/Meta Page identifier from the lead attribution entry.
          schema:
            type: string
            maxLength: 255
        - name: campaignId
          in: query
          schema:
            type: string
            maxLength: 255
        - name: adSetId
          in: query
          schema:
            type: string
            maxLength: 255
        - name: adId
          in: query
          schema:
            type: string
            maxLength: 255
        - name: dealStatus
          in: query
          schema:
            type: string
            enum: [open, won, lost]
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [created_at, name, last_interaction_at, stage]
            default: created_at
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: campaignIds
          in: query
          description: Repeat identifiers or names; selected campaigns and the legacy single campaign use OR. Commas remain part of each value.
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              minLength: 1
              maxLength: 255
          style: form
          explode: true
      responses:
        "200":
          description: Contact list; responseMode=page also returns total/page/limit and full/export pages include exportVersion, including when data is empty. Legacy requests retain the data array envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactListResponse"
  /v1/leads:
    get:
      summary: List leads visible to the current user
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: stageId
          in: query
          schema:
            type: string
            format: uuid
        - name: assignedUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: dealStatus
          in: query
          schema:
            type: string
            enum: [open, won, lost]
      responses:
        "200":
          description: Paginated lead list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadListResponse"
    post:
      summary: Create a lead in the current organization
      description: >
        A new lead whose final outcome is won requires lead_operate and the
        effective lead operation scope after assignment and distribution.
        The commercial transition, reservation and import receipt share one
        transaction. Existing import reentries retain their preservation policy.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadRequest"
      responses:
        "201":
          description: Lead created or existing lead reentry registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLeadResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "503":
          description: >
            lead_creation_workflow_unavailable rejects a new won outcome before
            COMMIT when the commercial workflow is unavailable. The whole
            creation is rolled back; no contact is saved. This explicit error
            permits a later manual retry with the same import key. Transport
            timeouts and unknown responses do not establish that rejection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
  /v1/leads/{id}:
    get:
      summary: Get a lead visible to the current user
      parameters:
