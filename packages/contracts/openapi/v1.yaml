  /v1/properties/settings/portfolio:
    get:
      summary: Read the organization's property portfolio settings
      description: >-
        Returns every group and key, with defaults for anything never saved, and
        revision 0 until the first save. These settings are stored only: they do
        not change publication or edit behaviour yet.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Current settings.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PropertyWorkspaceCacheControl"
            Vary:
              $ref: "#/components/headers/PropertyWorkspaceVary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSettingsResponse"
        "403":
          $ref: "#/components/responses/APIError"
    put:
      summary: Save property portfolio settings
      description: >-
        Requires settings_organization. Merges by key, so omitted groups and keys
        keep their stored value. Unknown groups or keys and out-of-range values
        return 400. A revision other than the stored one returns 409
        property_settings_conflict; use revision 0 for the first save.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
