  /v1/dashboard/stats:
    get:
      summary: Get dashboard KPI stats for visible leads
      description: >-
        totalLeads and the open, won and lost totals count unique visible lead
        cards selected by leads.created_at and their current deal status.
        totalEntries counts one initial arrival per visible card plus countable
        reentry events. For entries, date, source, page and campaign filters use
        that arrival; pipeline, owner, team, status, tags and visibility use the
        current card. Won conversion time still measures creation to closing.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardCampaignIds"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
        - $ref: "#/components/parameters/DashboardIncludeDetails"
      responses:
        "200":
          description: Dashboard KPI stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatsResponse"
  /v1/dashboard/lead-entries:
    get:
      summary: List visible initial arrivals and reentries behind the dashboard entry KPI
      description: >-
        Uses the same card scope and entry-level filters as totalEntries. Each
        visible card contributes one initial arrival even when historical
        initial ledger rows are duplicated. Reentries require countable ledger
        events. Pipeline name reflects the card's current pipeline.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardCampaignIds"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - name: cursor
          in: query
          description: Opaque nextCursor from the preceding response.
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: Authorized page of arrivals, sorted newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardLeadEntryDetailPageResponse"
