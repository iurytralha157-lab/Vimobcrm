            schema:
              $ref: "#/components/schemas/PublishPropertyRequest"
      responses:
        "202":
          description: Publication request accepted or returned as an idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyPublicationOverviewResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
