        "413":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/APIError"
  /v1/public/integrations/portals/grupo-olx/import-reports/{token}:
    post:
      summary: Durably receive an authenticated Grupo OLX import report
      description: >-
        Every syntactically valid JSON value is stored before acknowledgement because the provider does not retry.
        Shape validation, feedback normalization and bounded retry/dead-letter processing are asynchronous.
      security:
        - grupoOLXWebhookBasic: []
      parameters:
        - $ref: "#/components/parameters/GrupoOLXWebhookToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        "200":
          description: Raw report receipt durably stored or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrupoOLXImportReportEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "413":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/APIError"
  /v1/public/integrations/portals/grupo-olx/feed/{token}:
    get:
      summary: Fetch the canonical Grupo OLX VRSync feed
      description: >-
        Returns the single XML feed distributed to OLX, ZAP and Viva Real.
        Canonical grupo_olx publications in desired published state use their
        immutable published-version payload. During an update queued or currently
        publishing, the last-good published version remains in the feed; a first
        publication stays absent until it succeeds. A legacy listing is used only
        when the property has no canonical row for this integration account. A valid
        token returns an empty feed only after an activated integration is paused;
        draft integrations return a conflict until activation.
        The endpoint fails instead of returning a silently truncated feed above the
        safe 50,000-listing limit.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 128
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Deterministic VRSync XML representation for the current feed state.
          headers:
            ETag:
              description: Strong validator derived from the complete deterministic XML body.
              schema:
                type: string
            Cache-Control:
              description: Private revalidation policy because the path token is a bearer credential.
              schema:
                type: string
                example: private, no-cache
          content:
            application/xml:
              schema:
                type: string
        "304":
          description: The If-None-Match validator matches the current feed representation.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
  /v1/public/integrations/portals/chaves-na-mao/feed/{token}:
    get:
      summary: Fetch the dedicated Chaves na Mão XML feed
      description: >-
        Returns only listings configured for the Chaves na Mão channel. A valid
        token serves an empty drain feed while paused; draft integrations return a
        conflict. The endpoint remains fail-closed until official homologation is
        explicitly enabled and does not expose a lead-ingestion endpoint.
      security: []
      parameters:
        - $ref: "#/components/parameters/ChavesNaMaoFeedToken"
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Deterministic Chaves na Mão XML representation for the current feed state.
          headers:
            ETag:
              description: Strong validator derived from the complete deterministic XML body.
              schema:
                type: string
            Cache-Control:
              description: Private revalidation policy because the path token is a bearer credential.
              schema:
                type: string
                example: private, no-cache
          content:
            application/xml:
              schema:
                type: string
        "304":
          description: The If-None-Match validator matches the current feed representation.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
        "503":
          description: >-
            Homologation is closed (`chaves_na_mao_homologation_required`) or a
            safe feed size/listing limit was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
  /v1/public/property-publications/{publicationId}/versions/{version}/assets/{assetId}:
    get:
      summary: Resolve a currently published property asset to a short-lived signed URL
      description: >-
