openapi: 3.1.0
info:
  title: Vimob API
  version: 0.1.0
  description: >-
    Partial internal contract for selected Vimob CRM endpoints. This document is
    not the complete inventory of HTTP routes registered by the backend.
servers:
  - url: http://localhost:8081
    description: Local development server only; configure the deployed API origin per environment.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: API process is alive.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
            X-Vimob-Release-Sha:
              $ref: "#/components/headers/VimobReleaseSha"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HealthEnvelope"
                  - type: object
                    properties:
                      status:
                        const: ok
  /readyz:
    get:
      summary: Readiness check
      security: []
      responses:
        "200":
          description: API can reach dependencies.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
            X-Vimob-Release-Sha:
              $ref: "#/components/headers/VimobReleaseSha"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HealthEnvelope"
                  - type: object
                    properties:
                      status:
                        const: ready
        "503":
          description: API process is alive but a required dependency is unavailable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
            X-Vimob-Release-Sha:
              $ref: "#/components/headers/VimobReleaseSha"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
  /v1/me:
    get:
      summary: Current authenticated user and tenant context
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Current user and resolved context.
  /v1/lead-enrichments:
    get:
      summary: List card enrichments for visible leads
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: ids
          in: query
          schema:
            type: string
          description: Comma-separated lead ids. Repeated `id` query params are also accepted.
        - name: id
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
      responses:
        "200":
          description: Lead enrichment list scoped by organization and lead visibility.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeadEnrichment"
  /v1/pipeline-board:
    get:
      summary: Get pipeline stages with visible leads and counts
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: pipelineId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
      responses:
        "200":
          description: Pipeline board data.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PipelineBoardStage"
  /v1/pipeline-stage-leads:
    get:
      summary: List more visible leads for one pipeline stage
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: pipelineId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: stageId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
      responses:
        "200":
          description: Stage lead page.
          content:
            application/json:
              schema:
                type: object
                required: [stageId, leads]
                properties:
                  stageId:
                    type: string
                    format: uuid
                  leads:
                    type: array
                    items:
                      $ref: "#/components/schemas/PipelineBoardLead"
  /v1/pipeline-stage-counts:
    get:
      summary: Count visible leads by stage with pipeline filters
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: pipelineId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: stageIds
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated stage ids.
      responses:
        "200":
          description: Counts keyed by stage id.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: integer
                      format: int64
  /v1/lead-meta-filters:
    get:
      summary: List campaign/adset/ad options from visible lead metadata
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Meta Ads filter options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/LeadMetaFilters"
  /v1/dashboard/stats:
    get:
      summary: Get dashboard KPI stats for visible leads
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Dashboard KPI stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatsResponse"
  /v1/dashboard/funnel:
    get:
      summary: Get dashboard funnel counts by pipeline stage
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Funnel data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardFunnelResponse"
  /v1/dashboard/sources:
    get:
      summary: Get dashboard lead counts by source
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Source data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSourcesResponse"
  /v1/dashboard/top-brokers:
    get:
      summary: Get top brokers from visible closed leads
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Top brokers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardTopBrokersResponse"
  /v1/dashboard/upcoming-tasks:
    get:
      summary: Get upcoming open lead tasks
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        "200":
          description: Upcoming tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUpcomingTasksResponse"
  /v1/dashboard/deals-evolution:
    get:
      summary: Get dashboard deals evolution chart data
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Deals evolution data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardDealsEvolutionResponse"
  /v1/contacts:
    get:
      summary: List visible contacts for CRM screens or exports
      description: Use `mode=compact` for interactive screens and `mode=full` for exports that need all lead and Meta fields.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: mode
          in: query
          schema:
            type: string
            enum: [compact, full]
            default: compact
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 25
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
        - name: pipelineId
          in: query
          schema:
            type: string
            format: uuid
        - name: stageId
          in: query
          schema:
            type: string
            format: uuid
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: unassigned
          in: query
          schema:
            type: boolean
        - name: tagId
          in: query
          schema:
            type: string
            format: uuid
        - name: source
          in: query
          schema:
            type: string
            maxLength: 80
        - name: campaignId
          in: query
          schema:
            type: string
            maxLength: 120
        - name: adSetId
          in: query
          schema:
            type: string
            maxLength: 120
        - name: adId
          in: query
          schema:
            type: string
            maxLength: 120
        - name: dealStatus
          in: query
          schema:
            type: string
            enum: [open, won, lost]
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [created_at, name, last_interaction_at, stage]
            default: created_at
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Contact list with total count copied into each row for pagination compatibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactListResponse"
  /v1/leads:
    get:
      summary: List leads visible to the current user
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: stageId
          in: query
          schema:
            type: string
            format: uuid
        - name: assignedUserId
          in: query
          schema:
            type: string
            format: uuid
        - name: dealStatus
          in: query
          schema:
            type: string
            enum: [open, won, lost]
      responses:
        "200":
          description: Paginated lead list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadListResponse"
    post:
      summary: Create a lead in the current organization
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadRequest"
      responses:
        "201":
          description: Lead created or existing lead reentry registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLeadResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /v1/leads/{id}:
    get:
      summary: Get a lead visible to the current user
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lead detail.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Lead"
        "404":
          $ref: "#/components/responses/APIError"
    patch:
      summary: Update a lead in the current organization
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadRequest"
      responses:
        "200":
          description: Lead updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Lead"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
    delete:
      summary: Delete a lead in the current organization
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Lead deleted.
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
  /v1/leads/{id}/move-stage:
    post:
      summary: Move a lead to another pipeline stage
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveLeadStageRequest"
      responses:
        "200":
          description: Lead moved.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Lead"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
  /v1/leads/{id}/assign:
    post:
      summary: Transfer or clear the lead assignee
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignLeadRequest"
      responses:
        "200":
          description: Lead assignee updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Lead"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
  /v1/leads/{id}/redistribute:
    post:
      summary: Assign a lead using the active round-robin queue
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Round-robin assignment result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundRobinResult"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
  /v1/leads/{id}/tags:
    post:
      summary: Attach a tag to a lead
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadTagRequest"
      responses:
        "201":
          description: Tag attached.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
  /v1/leads/{id}/tags/{tagId}:
    delete:
      summary: Remove a tag from a lead
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tagId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Tag removed or was not attached.
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
  /v1/property-developments:
    get:
      summary: List property developments in the current organization
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
        - name: development_type
          in: query
          schema:
            $ref: "#/components/schemas/PropertyDevelopmentType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PropertyDevelopmentStatus"
        - name: commercial_status
          in: query
          schema:
            $ref: "#/components/schemas/PropertyDevelopmentCommercialStatus"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated development catalog with filtered portfolio totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDevelopmentListResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
    post:
      summary: Create a property development
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyDevelopmentRequest"
      responses:
        "201":
          description: Development workspace created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDevelopmentWorkspaceResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
  /v1/property-developments/{developmentId}/workspace:
    get:
      summary: Get the management workspace for a property development
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DevelopmentId"
      responses:
        "200":
          description: Development structure, commercial tables, recent events, and aggregate summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDevelopmentWorkspaceResponse"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
  /v1/property-developments/{developmentId}/units:
    get:
      summary: List units of a property development
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DevelopmentId"
        - name: building_id
          in: query
          schema:
            type: string
            format: uuid
        - name: floor_plan_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PropertyDevelopmentUnitStatus"
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Paginated unit inventory enriched with the selected commercial price, prioritizing the active table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDevelopmentUnitListResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
  /v1/property-developments/{developmentId}/reservations:
    get:
      summary: List reservations of a property development
      description: Reader-facing projection omits internal metadata, notes, payment snapshots, and idempotency keys.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DevelopmentId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/PropertyDevelopmentReservationStatus"
        - name: unit_id
          in: query
