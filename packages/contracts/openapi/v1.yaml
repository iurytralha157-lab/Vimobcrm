    StageOperationalAttention:
      type: object
      additionalProperties: false
      required:
        - source_mode
        - mode
        - warning_minutes
        - business_hours_only
      properties:
        source_mode:
          type: string
          enum: [inherit, local]
          description: >-
            `inherit` releases stage-owned overrides so the most specific
            active pipeline or organization policy applies. `local` makes this
            stage authoritative for each attention type; a null deadline
            creates a stage tombstone that suppresses a broader policy of the
            same type.
        mode:
          type: string
          enum: [disabled, shadow, enabled]
          description: >-
            Runtime mode for local attention rules. `shadow` measures without
            notifying. `disabled` persists local tombstones. This setting does
            not disable alerts for pending cadence tasks.
        first_outreach_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 2628000
        first_effective_contact_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 2628000
        stage_inactivity_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 2628000
        stage_max_age_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 2628000
        warning_minutes:
          type: integer
          minimum: 0
          maximum: 2628000
          description: Must be lower than every configured local deadline.
        escalation_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 2628000
        business_hours_only:
          type: boolean
