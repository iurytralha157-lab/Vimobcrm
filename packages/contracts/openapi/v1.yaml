openapi: 3.1.0
info:
  title: Vimob API
  version: 0.1.0
  description: >-
    Partial internal contract for selected Vimob CRM endpoints. This document is
    not the complete inventory of HTTP routes registered by the backend.
servers:
  - url: http://localhost:8081
    description: Local development server only; configure the deployed API origin per environment.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: API process is alive.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
            X-Vimob-Release-Sha:
              $ref: "#/components/headers/VimobReleaseSha"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HealthEnvelope"
                  - type: object
                    properties:
                      status:
                        const: ok
  /readyz:
    get:
      summary: Readiness check
      security: []
      responses:
        "200":
          description: API can reach dependencies.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
            X-Vimob-Release-Sha:
              $ref: "#/components/headers/VimobReleaseSha"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HealthEnvelope"
                  - type: object
                    properties:
                      status:
                        const: ready
        "503":
          description: API process is alive but a required dependency is unavailable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
            X-Vimob-Release-Sha:
              $ref: "#/components/headers/VimobReleaseSha"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
  /v1/me:
    get:
      summary: Current authenticated user and tenant context
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Current user and resolved context.
  /v1/me/profile:
    get:
      summary: Current authenticated profile and organization
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Current profile with the active organization revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionProfileResponse"
        "401":
          $ref: "#/components/responses/APIError"
  /v1/settings/properties:
    patch:
      summary: Partially update property-domain settings for the current organization
      description: >-
        Requires organization-settings management permission. Omitted fields are
        preserved; explicit null, an empty object, unknown fields and unsupported
        enum values are rejected. The current organization revision is required
        and stale writes return a specific conflict.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePropertySettingsRequest"
      responses:
        "200":
          description: Property settings updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySettingsUpdateResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          description: The organization settings revision is stale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySettingsConflictErrorEnvelope"
  /v1/lead-enrichments:
    get:
      summary: List card enrichments for visible leads
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: ids
          in: query
          schema:
            type: string
          description: Comma-separated lead ids. Repeated `id` query params are also accepted.
        - name: id
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
          style: form
          explode: true
      responses:
        "200":
          description: Lead enrichment list scoped by organization and lead visibility.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeadEnrichment"
  /v1/pipeline-board:
    get:
      summary: Get pipeline stages with visible leads and counts
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: pipelineId
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        - name: filterTags
          in: query
          description: Comma-separated tag UUIDs. A lead matches when it has any selected tag.
          schema:
            type: string
        - name: unassigned
          in: query
          description: When true, returns only leads without an assigned user.
          schema:
            type: boolean
        - name: teamId
          in: query
          description: Restricts leads to the selected team; it can be combined with unassigned.
          schema:
            type: string
            format: uuid
        - name: filterPage
          in: query
          description: Exact Facebook/Meta Page identifier carried by the same attribution entry as the other Meta filters.
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Pipeline board data.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PipelineBoardStage"
  /v1/pipeline-stage-leads:
    get:
      summary: List more visible leads for one pipeline stage
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: pipelineId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: stageId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 12
        - name: filterTags
          in: query
          description: Comma-separated tag UUIDs. A lead matches when it has any selected tag.
          schema:
            type: string
        - name: unassigned
          in: query
          description: When true, returns only leads without an assigned user.
          schema:
            type: boolean
        - name: teamId
          in: query
          description: Restricts leads to the selected team; it can be combined with unassigned.
          schema:
            type: string
            format: uuid
        - name: filterPage
          in: query
          description: Exact Facebook/Meta Page identifier carried by the same attribution entry as the other Meta filters.
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Stage lead page.
          content:
            application/json:
              schema:
                type: object
                required: [stageId, leads]
                properties:
                  stageId:
                    type: string
                    format: uuid
                  leads:
                    type: array
                    items:
                      $ref: "#/components/schemas/PipelineBoardLead"
  /v1/pipeline-stage-counts:
    get:
      summary: Count visible leads by stage with pipeline filters
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: pipelineId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: stageIds
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated stage ids.
        - name: filterTags
          in: query
          description: Comma-separated tag UUIDs. A lead matches when it has any selected tag.
          schema:
            type: string
        - name: unassigned
          in: query
          description: When true, returns only leads without an assigned user.
          schema:
            type: boolean
        - name: teamId
          in: query
          description: Restricts leads to the selected team; it can be combined with unassigned.
          schema:
            type: string
            format: uuid
        - name: filterPage
          in: query
          description: Exact Facebook/Meta Page identifier carried by the same attribution entry as the other Meta filters.
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Counts keyed by stage id.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: integer
                      format: int64
  /v1/lead-meta-filters:
    get:
      summary: List page/campaign/adset/ad options from visible lead attribution
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
        - name: filterPage
          in: query
          description: Restricts the returned campaign hierarchy to visible leads attributed to this exact Facebook/Meta Page identifier.
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: Meta Ads filter options.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/LeadMetaFilters"
  /v1/dashboard/stats:
    get:
      summary: Get dashboard KPI stats for visible leads
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
        - $ref: "#/components/parameters/DashboardIncludeDetails"
      responses:
        "200":
          description: Dashboard KPI stats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStatsResponse"
  /v1/dashboard/funnel:
    get:
      summary: Get dashboard funnel counts by pipeline stage
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Funnel data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardFunnelResponse"
  /v1/dashboard/sources:
    get:
      summary: Get dashboard lead counts by source
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Source data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSourcesResponse"
  /v1/dashboard/top-brokers:
    get:
      summary: Get top brokers from visible closed leads
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Top brokers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardTopBrokersResponse"
  /v1/dashboard/lead-distribution:
    get:
      summary: Get visible lead counts by assignee and assignment team
      description: >-
        Available only to organization owners, administrators and team leaders.
        Both dimensions use the same visible lead cohort and created_at period as
        the main lead KPI. Team buckets use the team recorded on the lead assignment,
        so every lead belongs to exactly one team bucket; missing assignments are
        returned as Sem responsável or Sem equipe. Each dimension returns at most
        50 named entities and consolidates any positive remainder into Outros.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Lead distribution across non-empty assignee and team buckets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardLeadDistributionResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /v1/dashboard/upcoming-tasks:
    get:
      summary: Get upcoming open lead tasks
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        "200":
          description: Upcoming tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUpcomingTasksResponse"
  /v1/dashboard/deals-evolution:
    get:
      summary: Get dashboard deals evolution chart data
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Deals evolution data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardDealsEvolutionResponse"
  /v1/analytics/campaign-insights:
    get:
      summary: Get consolidated Meta Ads and CRM campaign performance
      description: >-
        Returns daily paid-media facts joined to the last Meta attribution for each
        lead in the requested cohort. Both dates are required and the inclusive
        range cannot exceed 366 calendar days. When pageId is selected, CRM leads
        match the same last-touch entry, while paid metrics include only ad-level
        facts explicitly associated with that Facebook Page; historical coverage
        may therefore be partial.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/MarketingAnalyticsDateFrom"
        - $ref: "#/components/parameters/MarketingAnalyticsDateTo"
        - $ref: "#/components/parameters/MarketingAccountId"
        - $ref: "#/components/parameters/MarketingObjective"
        - $ref: "#/components/parameters/AnalyticsPageId"
        - $ref: "#/components/parameters/AnalyticsCampaignId"
        - $ref: "#/components/parameters/AnalyticsAdSetId"
        - $ref: "#/components/parameters/AnalyticsAdId"
        - $ref: "#/components/parameters/AnalyticsTeamId"
        - $ref: "#/components/parameters/AnalyticsUserId"
        - $ref: "#/components/parameters/AnalyticsSource"
        - $ref: "#/components/parameters/AnalyticsTagId"
        - $ref: "#/components/parameters/AnalyticsTagIds"
        - $ref: "#/components/parameters/AnalyticsDealStatus"
      responses:
        "200":
          description: Consolidated paid-media, CRM attribution and Meta connection analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingCampaignInsightsResponse"
        "400":
          description: Dates or UUID filters are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "503":
          description: Marketing schema, database capacity or query processing is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/analytics/lead:
    get:
      summary: Get public-site visitor journeys and lead conversion analytics
      description: >-
        Returns up to 100 recent visitor journeys plus funnel, page, device and
        geolocation aggregates. Without dates the backend uses the current seven-day
        period. Explicit dates must be supplied together and the inclusive range
        cannot exceed 366 calendar days.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/SiteAnalyticsDateFrom"
        - $ref: "#/components/parameters/SiteAnalyticsDateTo"
      responses:
        "200":
          description: Visitor journey and conversion analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadAnalyticsResponse"
        "400":
          description: Date filters are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/analytics/site-summary:
    get:
      summary: Get public-site analytics summary
      description: >-
        Returns page, session, duration, device, acquisition and conversion totals
        for the requested period and its immediately preceding comparison period.
        Without dates the backend uses the current seven-day period.
        Supplying only one date is invalid; explicit ranges are inclusive and limited
        to 366 calendar days.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/SiteAnalyticsDateFrom"
        - $ref: "#/components/parameters/SiteAnalyticsDateTo"
      responses:
        "200":
          description: Current and previous public-site KPI summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAnalyticsSummaryResponse"
        "400":
          description: Date filters are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/analytics/site-detailed:
    get:
      summary: Get detailed public-site content and acquisition analytics
      description: >-
        Returns property, page, campaign, search and daily traffic aggregates with
        session quality and lead totals. Deployments without the extended tracking
        columns return the same closed contract with empty property and search lists.
        Without dates the backend uses the current seven-day period; explicit dates
        must be supplied together and cannot span more than 366 calendar days.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/SiteAnalyticsDateFrom"
        - $ref: "#/components/parameters/SiteAnalyticsDateTo"
      responses:
        "200":
          description: Detailed public-site analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteAnalyticsDetailedResponse"
        "400":
          description: Date filters are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/contacts:
    get:
      summary: List visible contacts for CRM screens or exports
      description: Use `mode=compact` for interactive screens and `mode=full` for exports that need all lead and Meta fields.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: mode
          in: query
          schema:
            type: string
            enum: [compact, full]
            default: compact
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 25
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: teamId
          in: query
          schema:
            type: string
            format: uuid
        - name: pipelineId
          in: query
          schema:
            type: string
            format: uuid
        - name: stageId
          in: query
          schema:
            type: string
            format: uuid
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: unassigned
          in: query
          schema:
            type: boolean
        - name: tagId
          in: query
          schema:
            type: string
            format: uuid
        - name: tagIds
          in: query
          description: Comma-separated tag UUIDs. A contact matches when it has any selected tag.
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
            maxLength: 80
        - name: pageId
          in: query
          description: Exact Facebook/Meta Page identifier from the lead attribution entry.
          schema:
            type: string
            maxLength: 255
        - name: campaignId
          in: query
          schema:
            type: string
            maxLength: 120
        - name: adSetId
          in: query
          schema:
            type: string
            maxLength: 120
        - name: adId
          in: query
          schema:
            type: string
            maxLength: 120
        - name: dealStatus
          in: query
          schema:
            type: string
            enum: [open, won, lost]
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [created_at, name, last_interaction_at, stage]
            default: created_at
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Contact list with total count copied into each row for pagination compatibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactListResponse"
  /v1/leads:
    get:
      summary: List leads visible to the current user
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - name: stageId
          in: query
          schema:
            type: string
            format: uuid
        - name: assignedUserId
          in: query
          schema:
