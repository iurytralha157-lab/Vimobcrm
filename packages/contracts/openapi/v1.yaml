        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
        - name: tipo_de_negocio
          in: query
          schema:
            type: string
            maxLength: 80
        - name: tipo_de_imovel
          in: query
          schema:
            type: string
            maxLength: 80
        - name: cidade
          in: query
          schema:
            type: string
            maxLength: 120
        - name: bairro
          in: query
          schema:
            type: string
            maxLength: 120
        - name: responsavel_id
          in: query
          schema:
            type: string
            format: uuid
        - name: quartos_min
          in: query
          schema:
            type: integer
            minimum: 1
        - name: suites_min
          in: query
          schema:
            type: integer
            minimum: 1
        - name: banheiros_min
          in: query
          schema:
            type: integer
            minimum: 1
        - name: valor_min
          in: query
          schema:
            type: number
            minimum: 0
        - name: valor_max
          in: query
          schema:
            type: number
            minimum: 0
        - name: city_id
          in: query
          description: Canonical city identity; label fallback applies only to rows without a city ID, using the catalog state.
          schema:
            type: string
            format: uuid
        - name: neighborhood_id
          in: query
          description: Canonical neighborhood identity; fallback is scoped to its catalog city and state.
          schema:
            type: string
            format: uuid
        - name: uf
          in: query
          description: Brazilian state for legacy text matching without canonical locality IDs; catalog identity takes precedence when IDs are supplied.
          schema:
            type: string
            pattern: ^[A-Za-z]{2}$
