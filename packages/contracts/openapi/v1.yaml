          description: An identical idempotent replay returned the original lead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAPILeadResponse"
        "201":
          description: Lead created or re-entry recorded and distributed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAPILeadResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "402":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/APIError"
  /v1/public/webhooks/generic:
    post:
      summary: Receive a lead through a configured incoming webhook
      description: >-
        The token derives the active organization and configured defaults. An
        Idempotency-Key header, or event_id, submission_id, leadgen_id or external_id
        in the body, makes retries idempotent. The header takes precedence. Without an
        explicit identity, every request is processed as a distinct lead arrival even
        when its payload is identical.
      security:
        - vimobWebhookBearer: []
        - vimobWebhookHeader: []
      parameters:
        - $ref: "#/components/parameters/GenericWebhookIdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Lead accepted or returned as an identical idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingWebhookLeadResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "413":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/APIError"
