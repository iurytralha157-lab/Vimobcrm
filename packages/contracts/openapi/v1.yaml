    PropertyChannelPublication:
      type: object
      additionalProperties: false
      required:
        - id
        - channel
        - channel_account_key
        - label
        - available
        - desired_state
        - observed_state
        - readiness_state
        - readiness_score
        - checks
        - current_version
        - published_version
        - is_outdated
        - public_url
        - preview
        - capabilities
        - last_error
        - recent_jobs
      properties:
        id:
          type: [string, "null"]
          format: uuid
          description: Null while a channel is represented only by its virtual overview state.
        channel:
          type: string
          enum: [site, grupo_olx]
          maxLength: 64
          pattern: "^[a-z][a-z0-9_.-]*$"
        channel_account_key:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]*$"
          description: Site uses default; Grupo OLX uses portal_integrations.id when the integration exists.
        label:
          type: string
        available:
          type: boolean
        desired_state:
          type: string
          enum: [published, paused, unpublished]
        observed_state:
          type: string
          enum: [draft, queued, publishing, published, pausing, paused, unpublishing, unpublished, error]
        readiness_state:
          type: string
          enum: [unknown, ready, blocked]
        readiness_score:
          type: integer
          minimum: 0
          maximum: 100
        checks:
          type: array
          items:
            $ref: "#/components/schemas/PropertyPublicationCheck"
        current_version:
          type: integer
          minimum: 0
        published_version:
          type: [integer, "null"]
          minimum: 1
        is_outdated:
          type: boolean
        public_url:
          type: [string, "null"]
          format: uri
          minLength: 8
          maxLength: 2048
          pattern: "^https?://"
        preview:
          $ref: "#/components/schemas/PropertyPublicationPreview"
        capabilities:
          $ref: "#/components/schemas/PropertyPublicationCapabilities"
        last_error:
          oneOf:
            - $ref: "#/components/schemas/PropertyPublicationError"
            - type: "null"
        last_requested_at:
          type: [string, "null"]
          format: date-time
        last_attempt_at:
          type: [string, "null"]
          format: date-time
        last_succeeded_at:
          type: [string, "null"]
          format: date-time
        updated_at:
          type: [string, "null"]
          format: date-time
        recent_jobs:
          type: array
          maxItems: 20
          items:
