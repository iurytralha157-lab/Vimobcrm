openapi: 3.1.0
info:
  title: Vimob API
  version: 0.1.0
  description: >-
    Partial internal contract for selected Vimob CRM endpoints. This document is
    not the complete inventory of HTTP routes registered by the backend.
servers:
  - url: http://localhost:8081
    description: Local development server only; configure the deployed API origin per environment.
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: API process is alive.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
            X-Vimob-Release-Sha:
              $ref: "#/components/headers/VimobReleaseSha"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HealthEnvelope"
                  - type: object
                    properties:
                      status:
                        const: ok
  /readyz:
    get:
      summary: Readiness check
      security: []
      responses:
        "200":
          description: API can reach dependencies.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
            X-Vimob-Release-Sha:
              $ref: "#/components/headers/VimobReleaseSha"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/HealthEnvelope"
                  - type: object
                    properties:
                      status:
                        const: ready
        "503":
          description: API process is alive but a required dependency is unavailable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/HealthCacheControl"
            X-Vimob-Release-Sha:
              $ref: "#/components/headers/VimobReleaseSha"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
  /v1/notifications:
    get:
      summary: List notifications for the authenticated user
      description: >-
        Tenant and recipient scope are enforced before filtering. Filters apply
        before opaque cursor pagination and do not change unread totals.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: userId
          in: query
          description: Optional; must equal the authenticated user.
          schema: {type: string, format: uuid}
        - name: cursor
          in: query
          description: Opaque next_cursor from the previous page.
          schema: {type: string, maxLength: 512}
        - name: limit
          in: query
          description: Out-of-range numeric values are clamped by the repository.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: unreadOnly
          in: query
          schema: {type: boolean, default: false}
        - name: categories
          in: query
          description: OR within categories; repeated parameters and comma-separated values are accepted.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [leads, whatsapp, tasks, system]
      responses:
        "200":
          description: Filtered notifications and continuation cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/tables/{table}:
    get:
      summary: Read an allowed administrative table
      description: >-
        Requires SuperAdmin. Presence of search or offset opts into server-side
        pagination with data and meta.nextOffset; otherwise the legacy data-only
        envelope is preserved. Search is literal and accent-insensitive on
        approved fields. Notifications redact title/content/metadata. Pagination
        defaults to 120 rows; legacy listing defaults to 60.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: table
          in: path
          required: true
          schema:
            type: string
            enum: [notifications, organizations, users, organization_members,
              admin_subscription_plans, onboarding_requests, feature_requests,
              announcements, help_articles, audit_logs, email_templates,
              email_logs, organization_modules]
        - name: search
          in: query
          description: >-
            Presence opts into pagination, including an empty value. Maximum
            180 Unicode characters after trimming. Searchable tables:
            onboarding_requests, feature_requests, notifications, email_templates,
            email_logs, announcements, help_articles, audit_logs.
          schema: {type: string, maxLength: 180}
        - name: limit
          in: query
          description: Paged default 120; legacy default 60 and its established fallback.
          schema: {type: integer, minimum: 1, maximum: 200}
        - name: offset
          in: query
          description: Presence opts into pagination.
          schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
      responses:
        "200":
          description: Legacy data-only envelope or paginated rows with nullable nextOffset.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AdminTableLegacyResponse"
                  - $ref: "#/components/schemas/AdminTablePageResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/me:
    get:
      summary: Current authenticated user and tenant context
      description: Requires an active Supabase session; an organization header is optional.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Current user and resolved context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentIdentityResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/me/account-status:
    get:
      summary: Read the authenticated account status without requiring an organization
      description: >-
        Requires an active Supabase session. Allows an account with no active
        memberships to distinguish loss of its last organization from global
        suspension. Does not grant CRM data access.
      responses:
        "200":
          description: Status of the authenticated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountStatus"
        "401":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/me/profile:
    get:
      summary: Current authenticated profile and organization
      description: Requires an active Supabase session and resolved tenant context.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Current profile with the active organization revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionProfileResponse"
        "401":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/me/switch-organization:
    post:
      summary: Validate an active session and membership before changing organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organizationId]
              properties:
                organizationId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The authenticated user may enter the requested organization.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok:
                    const: true
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "503":
          description: Active-session lookup is unavailable; the organization change is denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/user-organizations:
    get:
      summary: List active organization memberships for the authenticated user
      description: >-
        Requires an active Supabase session. Available before tenant resolution,
        including when the list is empty.
      responses:
        "200":
          description: Organizations currently available to this identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserOrganizationListEnvelope"
        "401":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/users:
    get:
      summary: List members of the current organization
      description: >-
        include_inactive=true is for management; include_inactive=filters is
        for historical filter choices. Requires an active session and an active organization.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: include_inactive
          in: query
          schema:
            oneOf:
              - type: boolean
              - type: string
                const: filters
      responses:
        "200":
          description: Organization-scoped member list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUserListEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    post:
      summary: Legacy direct member creation is closed; use an invitation
      description: >-
        Requires users_manage and an active session before the handler. A valid
        request still returns 409 invitation_required; no user is created.
        Clients must use POST /v1/invitations instead.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegacyCreateOrganizationUserRequest"
      responses:
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          description: Direct creation is disabled; error code invitation_required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/users/{id}:
    patch:
      summary: Update a member profile, organization role or membership activity
      description: >-
        Requires users_manage permission. is_active changes only the current
        organization membership; global account suspension is separate.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationUserRequest"
      responses:
        "200":
          description: Organization member updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutateOrganizationUserResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    delete:
      summary: Remove a member from the current organization
      description: >-
        Requires users_manage permission. Lead and property ownership may need
        transfer. Revokes organization access, team and permission links while
        preserving the global identity and memberships in other organizations.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                transfer_leads_to_user_id:
                  type: [string, "null"]
                  format: uuid
                transfer_properties_to_user_id:
                  type: [string, "null"]
                  format: uuid
      responses:
        "200":
          description: Member removed from this organization.
          content:
            application/json:
              schema:
                type: object
                required: [success, impact]
                properties:
                  success:
                    const: true
                  impact:
                    $ref: "#/components/schemas/DeleteMemberImpact"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          description: Team memberships changed repeatedly during removal; error code user_team_membership_changed. Reload and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/users/{id}/delete-impact:
    get:
      summary: Preview transfer and access impact before removing a member
      description: Requires users_manage permission in the current organization.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Current organization-scoped impact counts.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DeleteMemberImpact"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/settings/password/status:
    get:
      summary: Read the authenticated user's password-change and lockout state
      description: >-
        Requires an active bearer session and resolved tenant context. A reset link
        requested by SuperAdmin is not a completed password change and is
        recorded in audit logs separately from lastChange.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Current recorded password status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordStatusEnvelope"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/organizations:
    get:
      summary: List organizations for SuperAdmin
      description: Requires a SuperAdmin identity and an active session; results are global, not tenant scoped.
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            default: all
        - name: segment
          in: query
          schema:
            type: string
            default: all
      responses:
        "200":
          description: Global organization summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrganizationListEnvelope"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    post:
      summary: Create an organization as SuperAdmin
      description: Requires a SuperAdmin identity and an active session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateOrganizationRequest"
      responses:
        "201":
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreateOrganizationResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/organizations/{id}:
    patch:
      summary: Update global organization settings as SuperAdmin
      description: Requires a SuperAdmin identity and an active session.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOrganizationUpdateRequest"
      responses:
        "200":
          description: Organization updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    delete:
      summary: Delete an organization after explicit name confirmation
      description: >-
        Requires a SuperAdmin identity and an active session. This operation
        permanently purges organization data after safety checks; the
        confirmation_name must match the persisted organization name.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation_name]
              properties:
                confirmation_name:
                  type: string
      responses:
        "200":
          description: Organization deleted; cleanup warnings may need follow-up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrganizationDeleteResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/organizations/{id}/modules:
    get:
      summary: List modules of one organization as SuperAdmin
      description: Requires a SuperAdmin identity and an active session.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Stored module configurations for the selected organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrganizationModuleListEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/organizations/{id}/payments:
    get:
      summary: List up to 80 payments of one organization as SuperAdmin
      description: Requires a SuperAdmin identity and an active session.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Payments ordered by due date and creation date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrganizationPaymentListEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/organizations/{id}/access:
    post:
      summary: Set organization and module access as SuperAdmin
      description: Requires a SuperAdmin identity and an active session.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organizationUpdates, modules]
              properties:
                organizationUpdates:
                  $ref: "#/components/schemas/AdminOrganizationUpdateRequest"
                modules:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Access configuration updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/users:
    get:
      summary: List users globally as SuperAdmin
      description: Requires a SuperAdmin identity and an active session; results are not tenant scoped.
      responses:
        "200":
          description: Global user summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListEnvelope"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/users/{id}:
    patch:
      summary: Change a user's global activity or primary organization as SuperAdmin
      description: Requires a SuperAdmin identity and an active session.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                is_active:
                  type: [boolean, "null"]
                organization_id:
                  type: [string, "null"]
                  format: uuid
      responses:
        "200":
          description: Global user profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    delete:
      summary: Deactivate a user globally as SuperAdmin
      description: >-
        Requires a SuperAdmin identity and an active session. The handler
        delegates to UpdateUser with is_active=false; it does not hard-delete
        the Auth identity.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: User globally deactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/users/{id}/reset-password:
    post:
      summary: Request a password-recovery email for a user as SuperAdmin
      description: >-
        Requires a SuperAdmin identity and an active session. A successful
        response means the Auth service accepted the request; it does not
        prove delivery or that the user changed the password.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Recovery request accepted by Auth.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPasswordRecoveryRequestEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/settings/roles:
    get:
      summary: List system and custom roles in the current organization
      description: Requires permissions_manage and an active session.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Current organization's role list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListEnvelope"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    post:
      summary: Create a custom role in the current organization
      description: Requires permissions_manage and authority to delegate every requested grant.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Custom role created; delegated grants are validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/settings/roles/{id}:
    patch:
      summary: Update a non-system role, including its active state
      description: Requires permissions_manage and an active session.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    delete:
