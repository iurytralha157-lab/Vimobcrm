  /v1/user-presence:
    get:
      summary: List presence for active organization members
      description: >-
        Requires `users_presence_view`. Returns one privacy-minimized row per active,
        non-platform member in the caller's presence scope. Owners, administrators,
        and non-leader roles with an explicit administrative grant see the full
        organization; team leaders see only active members of the teams they lead,
        including themselves. A session is fresh for three minutes; online takes
        precedence over idle when a user has multiple sessions. Idle duration is
        returned only when every relevant fresh idle session has a server-recorded
        transition timestamp.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Current permitted roster with aggregated presence, last-seen and idle-since timestamps.
          headers:
            Cache-Control:
              description: Presence responses are private and must not be stored.
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPresenceResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
