  /v1/properties/{id}/offers/{offerType}:
    put:
      summary: Create or replace one commercial offer for a property
      description: >-
        A missing offer can be created only when expected_updated_at is omitted.
        Changing an existing offer requires its current updated_at value. Repeating
        the exact current representation is idempotent and does not advance
        updated_at, even when retrying an earlier successful request. Missing or
        stale preconditions return 409. Active sale offers are projected to the
        legacy preco field; active rent takes precedence over active seasonal in
        valor_locacao.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
