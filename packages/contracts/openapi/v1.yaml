          description: Visible queue rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundRobinRuleListResponse"
        default:
          $ref: "#/components/responses/APIError"
    post:
      summary: Create a distribution rule with an explicit queue identifier
      description: Requires distribution_manage. roundRobinId and expectedRevision identify the queue and the snapshot being edited.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/CreateRoundRobinRuleRequest"
                - type: object
                  required: [roundRobinId]
      responses:
        "201":
          description: Rule created with the resulting queue revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundRobinRuleResponse"
        "409":
          $ref: "#/components/responses/APIError"
        "428":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
