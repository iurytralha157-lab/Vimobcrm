      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageAutomationStatusRequest"
      responses:
        "200":
          description: Updated rule with a strictly newer updated_at revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageAutomationEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          description: stage_automation_changed; reload and review before another explicit action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
  /v1/pipelines/{id}/round-robin:
    post:
      summary: Set the active round-robin queue for a pipeline
      description: >-
        Requires the original aggregate expectedRevision captured when selecting
        the queue. Missing or stale revisions return pipeline_changed (409).
        A busy queue returns round_robin_busy (409). Refresh and review before
        selecting again; never automatically retry or rebase the revision.
        An explicit null roundRobinId clears the fallback queue.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, roundRobinId]
              properties:
                expectedRevision:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
                roundRobinId:
                  type: [string, "null"]
                  format: uuid
      responses:
        "200":
          description: Pipeline round-robin updated.
        "400":
          description: Invalid revision or queue reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "403":
          description: Pipeline edit permission is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "404":
          description: Pipeline was not found in this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "409":
          description: Pipeline changed or queue is busy; review and retry explicitly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
  /v1/round-robin-whatsapp-sessions:
    get:
      summary: List organization WhatsApp connections available to distribution rules
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Lightweight WhatsApp connection list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoundRobinWhatsAppSessionOption"
        "403":
          $ref: "#/components/responses/APIError"
  /v1/round-robin-meta-forms:
    get:
      summary: List configured Meta forms available to distribution rules
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Lightweight configured Meta form list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoundRobinMetaFormOption"
        "403":
          $ref: "#/components/responses/APIError"
  /v1/round-robins:
    get:
      summary: List round-robin queues
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Round-robin queue list.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoundRobin"
    post:
      summary: Create a round-robin queue with rules and members
      description: Requires distribution_manage. Reuse the same Idempotency-Key and payload after an unknown creation outcome; another payload returns management_create_conflict (409).
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/ManagementIdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoundRobinRequest"
      responses:
        "201":
          description: Round-robin queue created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundRobinResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "428":
          description: A valid management creation key is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/round-robins/{id}:
    get:
      summary: Get a visible round-robin queue
      description: >-
        Returns the complete queue used by the dedicated distribution editor,
        including its rules and members. Leaders can only read queues within
        their leadership scope.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Round-robin queue detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundRobinResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "402":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    patch:
      summary: Update a round-robin queue
      description: Requires distribution_manage and expectedRevision. Missing revisions return round_robin_revision_required (428); stale revisions return round_robin_revision_conflict (409).
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoundRobinRequest"
      responses:
        "200":
          description: Round-robin queue updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundRobinResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "428":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    delete:
      summary: Delete a round-robin queue
      description: Requires distribution_manage and the current aggregate revision in If-Match. The queue is deactivated and retained as a tombstone for existing intake identities.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/ManagementRevisionIfMatchHeader"
      responses:
        "204":
          description: Round-robin queue deleted.
        "400":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "428":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/round-robins/{id}/history:
    get:
      summary: List audited changes for a visible distribution queue
      description: >-
        Requires `distribution_manage` and visibility over the queue. Results include
        queue, rule and member events in reverse chronological order. Within the
        initial creation batch, tied events are grouped deterministically as queue,
        rules and members; all later events keep chronological ordering.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
        - name: limit
          in: query
          description: Maximum number of history events.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of history events to skip.
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: Distribution queue audit history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistributionQueueHistoryListResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "402":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/round-robins/{id}/rules:
    get:
      summary: List rules for a round-robin queue
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
