      description: >-
        Requires automations.manage in the selected organization. Both activation
        and deactivation compare the exact displayed updated_at before any write.
        Missing or changed revision returns stage_automation_changed (409);
        malformed revision returns 400. Do not retry automatically. Even an
        unchanged status consumes a valid revision. Inactivity policies keep
