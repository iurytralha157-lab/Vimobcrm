  /v1/settings/has-permission:
    get:
      summary: Check one effective permission for the current member
      description: >-
        Requires an active session and a known, nonempty permissionKey. Uses
        the current tenant context. A 200 false result is an authorization
        decision, not a transport error; it does not replace server-side guards.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: permissionKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Boolean permission result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanEnvelope"
        "400":
          description: permissionKey is empty or unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/settings/password:
    post:
      summary: Change the authenticated user's password and revoke sessions
      description: >-
        A regular session uses source=settings, must prove the current
        password, and revokes other sessions after proof succeeds.
        A password-recovery session uses source=recovery and revokes all sessions.
        Session revocation must be accepted by Supabase Auth before the password
        update; a missing sessionsRevoked field in a response from an older API
        must not be treated as confirmation. Already-issued JWTs may remain valid
        until they expire.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed after Auth accepted session revocation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePasswordResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "429":
          description: Supabase Auth rate limited current password verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "502":
          description: >-
            Auth was unavailable for current password verification or proof
            session cleanup, could not confirm session revocation
            (password_session_revocation_unconfirmed), or revocation succeeded
            but the password update could not be confirmed
            (password_update_unconfirmed_after_revocation). The client must not
            present either result as a completed password change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "503":
          description: Active-session lookup is unavailable; the password change is denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/settings/properties:
    patch:
      summary: Partially update property-domain settings for the current organization
      description: >-
        Requires organization-settings management permission. Omitted fields are
        preserved; explicit null, an empty object, unknown fields and unsupported
        enum values are rejected. The current organization revision is required
        and stale writes return a specific conflict.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePropertySettingsRequest"
      responses:
        "200":
          description: Property settings updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySettingsUpdateResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          description: The organization settings revision is stale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertySettingsConflictErrorEnvelope"
