  /v1/properties/{id}/offers/{offerType}:
    put:
      summary: Create or replace one commercial offer for a property
      description: >-
        A missing offer can be created only when expected_updated_at is omitted.
        Changing an existing offer requires its current updated_at value. Repeating
        the exact current representation is idempotent and does not advance
        updated_at, even when retrying an earlier successful request. Missing or
        stale preconditions return 409. Active sale offers are projected to the
        legacy preco field; active rent takes precedence over active seasonal in
        valor_locacao.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
        - name: offerType
          in: path
          required: true
          schema:
            type: string
            enum: [sale, rent, seasonal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPropertyOfferRequest"
      responses:
        "200":
          description: Offer created, updated or returned as an idempotent replay.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PropertyWorkspaceCacheControl"
            Vary:
              $ref: "#/components/headers/PropertyWorkspaceVary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyOfferResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
