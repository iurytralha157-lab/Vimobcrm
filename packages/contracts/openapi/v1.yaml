    PublicTrackingRequest:
      type: object
      additionalProperties: false
      required: [organization_id, event_type, page_path, session_id]
      properties:
        organization_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            [
              pageview,
              page_view,
              session_start,
              page_duration,
              property_search,
              property_view,
              favorite,
              whatsapp_click,
              cta_click,
            ]
        page_path:
          type: string
          minLength: 1
          maxLength: 2000
        page_title:
          type: [string, "null"]
          maxLength: 300
        referrer:
          type: [string, "null"]
          maxLength: 2000
        session_id:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^(?!\\s*$)(?!\\s*site-contact:).+"
        property_id:
          type: [string, "null"]
          format: uuid
        device_type:
          type: [string, "null"]
          enum: [desktop, mobile, tablet, null]
        browser:
          type: [string, "null"]
          enum: [chrome, firefox, safari, edge, other, null]
        screen_width:
          type: [integer, "null"]
          minimum: 0
          maximum: 100000
        screen_height:
          type: [integer, "null"]
          minimum: 0
          maximum: 100000
        utm_source:
          type: [string, "null"]
          maxLength: 300
        utm_medium:
          type: [string, "null"]
          maxLength: 300
        utm_campaign:
          type: [string, "null"]
          maxLength: 300
        gclid:
          type: [string, "null"]
          maxLength: 300
        fbclid:
          type: [string, "null"]
          maxLength: 300
        metadata:
          $ref: "#/components/schemas/PublicTrackingMetadata"
      allOf:
        - if:
            properties:
              event_type:
                const: page_duration
            required: [event_type]
          then:
            required: [metadata]
            properties:
              metadata:
                allOf:
                  - $ref: "#/components/schemas/PublicTrackingMetadata"
                  - type: object
                    required: [duration_seconds]
          else:
            properties:
              metadata:
                not:
                  required: [duration_seconds]
        - if:
            properties:
              event_type:
                const: property_search
            required: [event_type]
          else:
            properties:
              metadata:
                not:
                  required: [filters]
        - if:
            properties:
              event_type:
                enum: [cta_click, whatsapp_click]
            required: [event_type]
          else:
            properties:
              metadata:
                not:
                  anyOf:
                    - required: [action]
                    - required: [placement]
