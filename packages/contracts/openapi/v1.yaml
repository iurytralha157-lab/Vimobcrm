        invalidates the old confirmation.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteStageAutomationRequest"
      responses:
        "204":
          description: Automation deleted.
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          description: stage_automation_changed; review the current rule in a new confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
  /v1/stage-automations/{id}/status:
