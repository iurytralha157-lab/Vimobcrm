      responses:
        "200":
          description: Property updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
    delete:
      summary: Delete a property in the current organization
      description: Requires the last observed property revision to prevent deletion of a newer concurrent edit.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyDeleteRequest"
      responses:
        "204":
          description: Property deleted.
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
  /v1/properties/{id}/workspace:
    get:
      summary: Get the role-aware operational workspace for a property
      description: >-
        Returns an explicit allowlisted projection. Users with property management
        permission receive internal offer data, confidential assets, keys and recent
        key movements. Read-only viewers receive active offers only, no physical-key
        data, and redacted internal terms, metadata and notes. Owner contacts are
        included only when the organization policy allows them.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Role-aware property workspace.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PropertyWorkspaceCacheControl"
            Vary:
              $ref: "#/components/headers/PropertyWorkspaceVary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyWorkspaceResponse"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
  /v1/properties/{id}/publications:
    get:
      summary: Get the channel publication state and safe preview for a property
      description: >-
        Always returns Site plus Grupo OLX · ZAP · Viva Real, including an
        unavailable virtual Grupo OLX view. Returns channel-specific readiness, immutable published-version state,
        capabilities and recent jobs. The preview is an allowlisted public
        projection and never includes owner, key, token or internal asset-path data.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
