  /v1/public/integrations/portals/grupo-olx/import-reports/{token}:
    post:
      summary: Durably receive an authenticated Grupo OLX import report
      description: >-
        Every syntactically valid JSON value is stored before acknowledgement because the provider does not retry.
        Shape validation, feedback normalization and bounded retry/dead-letter processing are asynchronous.
      security:
        - grupoOLXWebhookBasic: []
      parameters:
