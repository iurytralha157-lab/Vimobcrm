        "404":
          $ref: "#/components/responses/APIError"
        "409":
          description: stage_automation_changed; preserve the draft and do not retry automatically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
    delete:
      summary: Delete a column automation with the confirmation revision
      description: >-
        Requires automations.manage in the selected organization. Send the exact
