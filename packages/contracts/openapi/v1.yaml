          maximum: 2628000
        warning_minutes:
          type: [integer, "null"]
          minimum: 0
          maximum: 2628000
        is_required:
          type: boolean
        outcome_required:
          type: boolean
    StageOperationalCadenceInput:
      type: object
      additionalProperties: false
      required: [enabled, tasks]
      properties:
        enabled:
          type: boolean
        tasks:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/OperationalCadenceTask"
    StageOperationalCadence:
      type: object
      additionalProperties: false
      required: [enabled, tasks]
      properties:
        enabled:
          type: boolean
        template_id:
          type: string
          format: uuid
          readOnly: true
          description: >-
            Canonical stage-owned template. It is absent while the displayed
            task list is inherited and is never used as a mutation selector.
        tasks:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/OperationalCadenceTask"
    StageOperationalAttention:
      type: object
      additionalProperties: false
      required:
        - source_mode
        - mode
        - warning_minutes
        - business_hours_only
      properties:
        source_mode:
          type: string
          enum: [inherit, local]
          description: >-
            `inherit` releases stage-owned overrides so the most specific
            active pipeline or organization policy applies. `local` makes this
            stage authoritative for each attention type; a null deadline
            creates a stage tombstone that suppresses a broader policy of the
            same type.
        mode:
          type: string
          enum: [disabled, shadow, enabled]
          description: >-
            Runtime mode for local attention rules. `shadow` measures without
            notifying. `disabled` persists local tombstones. This setting does
            not disable alerts for pending cadence tasks.
        first_outreach_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 2628000
        first_effective_contact_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 2628000
        stage_inactivity_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 2628000
        stage_max_age_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 2628000
        warning_minutes:
          type: integer
          minimum: 0
          maximum: 2628000
          description: Must be lower than every configured local deadline.
        escalation_minutes:
          type: [integer, "null"]
          minimum: 1
          maximum: 2628000
        business_hours_only:
          type: boolean
    StageOperationalLifecycle:
      type: object
      additionalProperties: false
      required: [on_stage_move, on_won, on_lost, on_reopen]
      properties:
        on_stage_move:
          type: string
          const: skip_pending
        on_won:
          type: string
          const: cancel_pending
        on_lost:
          type: string
          const: cancel_pending
        on_reopen:
          type: string
          const: new_cycle
    StageOperationalRulesInput:
      type: object
      additionalProperties: false
      required: [revision, cadence, attention, lifecycle]
      properties:
        stage_id:
          type: string
          format: uuid
        pipeline_id:
          type: string
          format: uuid
        revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
