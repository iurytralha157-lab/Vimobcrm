                $ref: "#/components/schemas/HelpArticleEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/home-publications:
    get:
      summary: List all home publications
      description: Superadministrator only.
      responses:
        "200":
          description: All configured home publications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationListEnvelope"
        default:
          $ref: "#/components/responses/APIError"
    post:
      summary: Create a home publication
      description: Superadministrator only. Images are attached through the dedicated image endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomePublicationCreateRequest"
      responses:
        "201":
          description: Home publication created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/home-publications/{id}:
    patch:
      summary: Update a home publication
      description: Superadministrator only. `startsAt` and `endsAt` accept null to clear their values.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomePublicationUpdateRequest"
      responses:
        "200":
          description: Home publication updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationEnvelope"
        default:
          $ref: "#/components/responses/APIError"
    delete:
      summary: Delete a home publication
      description: Superadministrator only. Image cleanup failures are returned as a non-fatal warning.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Home publication deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationDeleteResponse"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/home-publications/order:
    put:
      summary: Reorder home publications atomically
      description: Superadministrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomePublicationOrderRequest"
      responses:
        "200":
          description: Complete reordered publication list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationListEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/home-publications/{id}/image:
    post:
      summary: Upload or replace a home publication image
      description: Superadministrator only. Accepts JPEG, PNG, or WebP files up to 5 MiB.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image attached to the home publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationImageMutationResponse"
        default:
          $ref: "#/components/responses/APIError"
    delete:
      summary: Remove a home publication image
      description: Superadministrator only. Storage cleanup failures are returned as a non-fatal warning.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Image detached from the home publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationImageMutationResponse"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/home-publications/{id}/mobile-image:
    post:
      summary: Upload or replace only the mobile image of a home publication
      description: Superadministrator only. Accepts JPEG, PNG, or WebP files up to 5 MiB. Leaves the desktop image unchanged.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Mobile image attached to the home publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationImageMutationResponse"
        default:
          $ref: "#/components/responses/APIError"
    delete:
      summary: Remove only the mobile image of a home publication
      description: Superadministrator only. Leaves the desktop image unchanged. Storage cleanup failures are returned as a non-fatal warning.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Mobile image detached from the home publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationImageMutationResponse"
        default:
          $ref: "#/components/responses/APIError"
  /v1/public/integrations/meta/webhook:
    get:
      summary: Verify the backend-owned Meta webhook
      description: Public verification endpoint registered in the Meta app. The backend validates the configured verify token before echoing the challenge.
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
            enum: [subscribe]
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification challenge accepted and echoed.
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/APIError"
    post:
      summary: Receive signed Meta lead and messaging events
      description: Public ingress for Meta Lead Ads, Messenger and Instagram. The Go backend verifies X-Hub-Signature-256 against the exact raw body, durably queues the event and resolves its organization from connected server-side integration data.
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
            pattern: "^sha256=[0-9a-fA-F]{64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Signed event was durably registered for processing.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Signature is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "413":
          description: Request body exceeds the backend limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/public/marketing/oauth/meta/callback:
    get:
      summary: Complete the read-only Marketing login with Meta
      description: Public callback registered in the Meta app. A single-use state that expires in 10 minutes is checked before any provider call. Redirects to the allowlisted CRM URL with a status and an error code, never a token.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Back to the CRM with marketing_connection=success or error.
        default:
          $ref: "#/components/responses/APIError"
  /v1/marketing/connections:
    get:
      summary: List read-only Marketing connections of the organization
      responses:
        "200":
          description: Connections and their assets. Tokens are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, meta_configured, connections]
                properties:
                  enabled:
                    type: boolean
                  meta_configured:
                    type: boolean
                  connections:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        default:
          $ref: "#/components/responses/APIError"
  /v1/marketing/connections/meta/start:
    post:
      summary: Start the read-only Marketing login with Meta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [return_url]
              properties:
                return_url:
                  type: string
                  format: uri
      responses:
        "200":
          description: Provider URL to open in the browser.
          content:
            application/json:
              schema:
                type: object
                required: [auth_url]
                properties:
                  auth_url:
                    type: string
                    format: uri
        default:
          $ref: "#/components/responses/APIError"
  /v1/marketing/connections/{id}/assets:
    put:
      summary: Choose which assets of a connection feed Marketing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selected_asset_ids]
              properties:
                selected_asset_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "204":
          description: Selection saved.
        default:
          $ref: "#/components/responses/APIError"
  /v1/marketing/connections/{id}/sync:
    post:
      summary: Import Marketing data through a read-only connection
      description: Owners and admins. Reads from the provider and writes only Marketing facts, up to 90 days per call.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [date_start, date_stop]
              properties:
                date_start:
                  type: string
                  format: date
                date_stop:
                  type: string
                  format: date
      responses:
        "200":
          description: Rows imported and per-source errors.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/APIError"
  /v1/marketing/connections/{id}:
    delete:
      summary: Forget a Marketing login in the CRM
      description: Local only. Does not call the provider, so the lead intake keeps its access.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Connection and its stored token removed.
        default:
          $ref: "#/components/responses/APIError"
  /v1/public/integrations/meta/oauth/callback:
    get:
      summary: Complete the backend-owned Meta OAuth flow
      description: Public callback registered in the Meta app. Redirects to the allowlisted frontend return URL with only an opaque flow id and status; provider credentials are never returned.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the allowlisted frontend OAuth return URL.
        default:
          $ref: "#/components/responses/APIError"
  /v1/integrations/meta/oauth/actions:
    post:
      summary: Manage a Meta connection through the Go backend
      description: Owner/admin only. Supports get_auth_url, connect_page, update_page, disconnect_page, toggle_page, and update_ad_accounts. Provider codes and tokens are rejected from browser input.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              additionalProperties: true
              properties:
                action:
                  type: string
                  enum:
                    [
                      get_auth_url,
                      connect_page,
                      update_page,
                      disconnect_page,
                      toggle_page,
                      update_ad_accounts,
                    ]
                return_url:
                  type: string
                  format: uri
                flow_id:
                  type: string
                  format: uuid
                page_id:
                  type: string
      responses:
        "200":
          description: Safe action result without provider credentials.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/APIError"
  /v1/integrations/meta/conversion-feedback:
    put:
      summary: Configure CRM funnel feedback for a connected Meta Page
      description: >-
        Requires the campaigns module and settings_integrations permission.
        The CRM Dataset token is write-only, encrypted in Vault before storage,
        and never returned. Enabling affects future funnel events only; no
        historical CRM outcomes are silently delivered to Meta.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [integrationId, enabled]
              properties:
                integrationId:
                  type: string
                  format: uuid
                datasetId:
                  type: [string, "null"]
                  pattern: "^[0-9]{5,30}$"
                datasetName:
                  type: [string, "null"]
                  maxLength: 160
                datasetAccessToken:
                  type: [string, "null"]
                  maxLength: 8192
                  writeOnly: true
                enabled:
                  type: boolean
      responses:
        "200":
          description: Tokenless CRM feedback configuration state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - organization_id
                      - conversion_feedback_enabled
                      - conversion_feedback_status
                    properties:
                      id:
                        type: string
                        format: uuid
                      organization_id:
                        type: string
                        format: uuid
                      page_id:
                        type: string
                      crm_dataset_id:
                        type: string
                      crm_dataset_name:
                        type: string
                      conversion_feedback_enabled:
                        type: boolean
                      conversion_feedback_status:
                        type: string
                        enum: [not_configured, active, paused, error]
                      conversion_feedback_last_sent_at:
                        type: string
                        format: date-time
                      conversion_feedback_last_validated_at:
                        type: string
                        format: date-time
                      conversion_feedback_last_error:
                        type: string
        default:
          $ref: "#/components/responses/APIError"
  /v1/integrations/meta/marketing/sync:
    post:
      summary: Synchronize Meta Ads and Instagram facts
      description: Owner/admin only. Organization and user are always derived from the authenticated tenant context. Meta credentials are loaded by the Go backend from Vault. A concurrent synchronization for the same organization returns `409 marketing_sync_in_progress`.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [date_start, date_stop]
              properties:
                date_start:
                  type: string
                  format: date
                date_stop:
                  type: string
                  format: date
      responses:
        "200":
          description: Synchronous bounded synchronization result. Provider-level partial warnings remain in `errors`; fatal non-2xx responses always use the standard API error envelope.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, synced, media_synced, social_synced, errors]
                properties:
                  success:
                    type: boolean
                  synced:
                    type: integer
                  media_synced:
                    type: integer
                  social_synced:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
        "409":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/integrations/meta/pages/{pageId}/forms:
    get:
      summary: List lead forms for a connected Meta Page
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lead forms returned by Meta through the backend.
          content:
            application/json:
              schema:
                type: object
                required: [forms]
                properties:
                  forms:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        default:
          $ref: "#/components/responses/APIError"
  /v1/integrations/meta/conversations/{id}/messages:
    post:
      summary: Send a Messenger or Instagram message
      description: Sender, recipient, platform and Page credential are derived from the tenant-scoped conversation. The browser supplies the text and one UUID generated for this send attempt. The backend durably reserves that UUID before contacting Meta, so replaying it never sends twice.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text, idempotencyKey]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
                idempotencyKey:
                  type: string
                  format: uuid
                  description: Stable client-generated UUID reused by transport retries of this exact send attempt.
      responses:
        "200":
          description: Existing reservation returned without another Meta request, or a definitive failed state was returned safely.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "201":
          description: Provider accepted the message and the backend persisted it.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "202":
          description: The reservation is pending or uncertain. Reusing the same UUID returns this state without contacting Meta again.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
        default:
          $ref: "#/components/responses/APIError"
  /v1/invitations:
    get:
      summary: List invitations for the active organization
      description: >-
        Requires users_manage. A SuperAdmin may select an organization with
        organizationId. Returns pending invitations and invitations accepted in
        the last 90 days. E-mail delivery fields refer only to the current link;
        neither the plaintext token nor its hash is returned.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: organizationId
          in: query
          required: false
          description: Organization selector for SuperAdmin requests.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitations and current-link delivery state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitationListEnvelope"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    post:
      summary: Create an invitation in the active organization
      description: >-
        Requires users_manage; admin and manager invitations also require
        privileged-invitation authority. The invitation remains valid when
        e-mail delivery fails or its outcome is unknown. The response does not
        expose the token. An accepted provider request does not prove delivery.
        An inactive recipient account returns 403 invitation_account_inactive.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInvitationCreateRequest"
      responses:
        "201":
          description: Invitation created; inspect email_status for the send outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitationEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/invitations/{id}:
    patch:
      summary: Change the role of a pending invitation
      description: >-
        Requires users_manage in the active organization. Only an unaccepted,
        unexpired invitation can be changed. The operation changes only the
        persisted role and preserves the invitation token and expiry. Reading
        or assigning the privileged admin and manager roles requires the same
        privileged-invitation authority used when creating invitations.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationRoleUpdateRequest"
      responses:
        "200":
          description: Invitation role changed without rotating its token or expiry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitationEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    delete:
      summary: Cancel an unaccepted invitation
      description: >-
        Requires users_manage in the active organization. Cancelling a
        privileged invitation requires privileged-invitation authority.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Invitation cancelled.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok]
                properties:
                  ok:
                    const: true
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/invitations/{id}/resend:
    post:
      summary: Rotate an unaccepted invitation link and request another e-mail
      description: >-
        Requires users_manage and, for admin or manager invitations,
        privileged-invitation authority. Works for expired invitations. A new
        link invalidates the previous one. If the provider outcome is unknown,
        the new link stays valid and the response reports delivery_unknown. A
        definitive provider rejection restores the previous link and returns an
        error. Provider acceptance does not prove delivery.
        An inactive recipient account returns 403 invitation_account_inactive.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Link rotated; inspect email_status for the send outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitationEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "422":
          $ref: "#/components/responses/APIError"
        "502":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/invitations/{token}/accept:
    post:
      summary: Accept an invitation with an existing authenticated account
      description: >-
        Requires an active Supabase session for the invited e-mail, but no
        pre-existing membership in the target organization. Acceptance cannot
        reactivate a globally inactive account. The legal document versions
        must match the server's current versions. An inactive account returns
        403 invitation_account_inactive.
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptAuthenticatedRequest"
      responses:
        "200":
          description: Invitation accepted or a committed acceptance replayed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/InvitationCapabilityCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationAcceptanceEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "503":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/public/invitations/{token}:
    get:
      summary: Preview an invitation by its bearer link
      description: >-
        A valid but unavailable, expired, or consumed link returns data: null.
        A malformed token returns 400. The link is a credential and must not
        reach logs or referrers. Requests are limited by client IP and token in
        a shared ten-minute window.
      security: []
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: Invitation preview, or null when the link is unavailable.
          headers:
            Cache-Control:
              $ref: "#/components/headers/InvitationCapabilityCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreviewEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "429":
          description: Shared IP or token limit exceeded; error code invitation_rate_limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "503":
          description: Shared limiter unavailable; validation fails closed with invitation_rate_limit_unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/public/invitations/{token}/accept:
    post:
      summary: Accept an invitation for a new account or request existing-account login
      description: >-
        For a new account, the invitee supplies name, password, and current
        legal consent. If the e-mail already belongs to an established account,
        the response has requiresLogin: true and does not activate membership;
        the user must then use the authenticated acceptance route. Requests are
        limited by client IP and token in a shared ten-minute window.
      security: []
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptPublicRequest"
      responses:
        "200":
          description: Accepted for a new account, replayed, or requires existing-account login.
          headers:
            Cache-Control:
              $ref: "#/components/headers/InvitationCapabilityCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationAcceptanceEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "429":
          description: Shared IP or token limit exceeded; error code invitation_rate_limited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "503":
          description: Shared limiter unavailable; validation fails closed with invitation_rate_limit_unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/whatsapp/conversations/start:
    post:
      summary: Open a lead conversation on its current canonical phone
      description: >-
        Requires whatsapp_operate and the original organization of the user.
        Does not join attendance or send a message. A changed phone requires
        explicit confirmation of the exact previous conversation. Existing
        unlinked destination history additionally requires owner-only preview
        and consent; retirement and attachment commit in one transaction.
        Provider work already started or accepted prevents route retirement.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppStartConversationRequest"
      responses:
        "200":
          description: Authorized conversation envelope; no provider send is performed.
        "409":
          description: >-
            whatsapp_phone_change_confirmation_required returns only authorized
            previous route references. Destination history references are
            available only to the session owner. Other conflicts do not carry
            a confirmation payload and must not trigger an automatic retry.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIErrorEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WhatsAppPhoneChangeConfirmation"
        default:
          $ref: "#/components/responses/APIError"
  /v1/whatsapp/conversations/{conversationId}/send-status:
    get:
      summary: Resolve an existing outbound send intent without resending
      description: >-
        Requires whatsapp_view and current access to the exact conversation,
        session and expected lead. An unknown provider outcome remains pending;
        this lookup never retries, creates or cancels an outbox operation.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: expectedLeadId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: clientMessageId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: The exact persisted outbound intent and its visible message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSendStatusResult"
        "404":
          description: >-
            whatsapp_message_not_found means the intent has not been observed;
            absence does not establish a definitive send failure. A conversation
            access failure uses its own error code and must clear the stale UI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/whatsapp/quick-replies:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdHeader"
    get:
      summary: List my personal saved WhatsApp messages
      description: >-
        Requires the active WhatsApp module and whatsapp_view. The authenticated
        user and active organization define ownership; teammates and other
        organizations cannot list these messages. Returns at most 200 items,
        sorted by shortcut. Does not send a WhatsApp message.
      responses:
        "200":
          description: Personal saved messages. Cache-Control is no-store.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 200
                    items:
                      $ref: "#/components/schemas/WhatsAppQuickReply"
        default:
          $ref: "#/components/responses/APIError"
    post:
      summary: Save a personal WhatsApp message
      description: >-
        Requires the active WhatsApp module and whatsapp_operate. Ownership is
        derived from the authenticated actor, never from JSON. At most 200
        messages per user in each organization. Content is stored literally;
        saving or selecting it does not send to a lead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppQuickReplyInput"
      responses:
        "201":
          description: Saved personal message. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppQuickReplyResponse"
        "409":
          description: whatsapp_quick_reply_shortcut_conflict or whatsapp_quick_reply_limit_reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/whatsapp/quick-replies/{id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationIdHeader"
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      summary: Edit one of my saved WhatsApp messages
      description: >-
        Requires the active WhatsApp module and whatsapp_operate. Partial update
        requires at least one non-null field. Unknown fields are rejected.
        Ownership cannot be changed. Missing or foreign IDs return the same 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                shortcut:
                  $ref: "#/components/schemas/WhatsAppQuickReplyShortcutInput"
                content:
                  $ref: "#/components/schemas/WhatsAppQuickReplyContent"
      responses:
        "200":
          description: Updated personal message. Cache-Control is no-store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppQuickReplyResponse"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    delete:
      summary: Delete one of my saved WhatsApp messages
      description: >-
        Requires the active WhatsApp module and whatsapp_operate. The query
        includes organization, authenticated user and ID. Missing or foreign IDs
        return the same 404. Does not remove any message from a lead conversation.
      responses:
        "204":
          description: Deleted. Empty response; Cache-Control is no-store.
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
components:
  securitySchemes:
    automationCommandToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Dedicated server-only AUTOMATION_COMMAND_TOKEN; empty configuration disables the command endpoint.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    grupoOLXWebhookBasic:
      type: http
      scheme: basic
      description: CRM-wide Grupo OLX SECRET_KEY provisioned by the provider; never stored per tenant.
    vimobAPIKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: Vimob API key
      description: Organization-scoped key with the `vimob_` prefix.
    vimobAPIKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: Alternative carrier for the same organization-scoped Vimob API key.
    vimobWebhookBearer:
      type: http
      scheme: bearer
      bearerFormat: Vimob webhook token
    vimobWebhookHeader:
      type: apiKey
      in: header
      name: X-Webhook-Token
  headers:
    HealthCacheControl:
      description: Prevents caches from retaining health, readiness or release identity state.
      schema:
        type: string
        const: no-store
    VimobReleaseSha:
      description: Full immutable Git commit SHA for the running image, or the fail-closed local fallback.
      schema:
        $ref: "#/components/schemas/VimobReleaseSha"
    PropertyWorkspaceCacheControl:
      description: Prevents shared or browser caches from retaining role-aware workspace data.
      schema:
        type: string
        enum: ["private, no-store"]
    PropertyWorkspaceVary:
      description: Always includes Authorization and X-Organization-ID; middleware may also add Origin.
      schema:
        type: string
      example: Authorization, X-Organization-ID
    InvitationCapabilityCacheControl:
      description: Prevents caching a bearer-link response.
      schema:
        type: string
        const: "private, no-store"
  parameters:
    ManagementIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generated once for one management creation attempt. Keep this key and payload together when retrying an unknown result; it is scoped to the organization, caller and entity type.
      schema:
        type: string
        format: uuid
    ManagementRevisionIfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: Current parent queue revision as one quoted positive integer. Missing revisions return 428; stale revisions return 409.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
      example: '"12"'
    TagRevisionIfMatchHeader:
      name: If-Match
      in: header
      required: true
      description: Observed tag updated_at as one quoted RFC3339 timestamp. A missing or invalid revision returns 400; a changed tag returns 409.
      schema:
        type: string
        pattern: '^"[0-9]{4}-[0-9]{2}-[0-9]{2}T[^" ]+"$'
      example: '"2026-10-12T18:00:00.123456Z"'
    PublicAPIIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for one external lead event; reuse only for retries of the identical body.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[\\x21-\\x7E]+$"
    GenericWebhookIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Stable key for one logical webhook arrival. Reuse only when retrying the
        identical request. When omitted, identical payloads are processed as distinct
        arrivals.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    GrupoOLXWebhookToken:
      name: token
      in: path
      required: true
      description: Private per-integration path token. It is a credential and must never be logged.
      schema:
        type: string
        minLength: 32
        maxLength: 128
    ChavesNaMaoFeedToken:
      name: token
      in: path
      required: true
      description: Private Chaves na Mão feed credential. It must never be logged or shared outside the homologated portal channel.
      schema:
        type: string
        minLength: 32
        maxLength: 256
    OrganizationIdHeader:
      name: X-Organization-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Active organization when the user belongs to more than one organization.
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      description: >-
        Secret invitation capability. It expires and must not be logged or sent
        to other sites through referrers.
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
    PropertyKeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PropertyAssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PropertyKeyIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque organization-scoped retry key for one semantic key movement.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    PropertyPublicationIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Organization-scoped retry key for one semantic publication command.
        Reuse with a different request payload returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    DevelopmentId:
      name: developmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DevelopmentUnitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DevelopmentPriceTableId:
      name: priceTableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DevelopmentReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Canonical UUID that makes reservation creation safe to retry with the same request.
      schema:
        type: string
        format: uuid
    DashboardDateFrom:
      name: dateFrom
      in: query
      description: Optional inclusive lower bound. Omit both dashboard dates to query all visible history.
      schema:
        type: string
        format: date-time
    DashboardDateTo:
      name: dateTo
      in: query
      description: Optional inclusive upper bound. Must be supplied together with dateFrom.
      schema:
        type: string
        format: date-time
    DashboardIncludeDetails:
      name: includeDetails
      in: query
      description: Opt in to at most 100 recent won and 100 recent lost lead details. Aggregate totals are always exact.
      schema:
        type: boolean
        default: false
    DashboardPipelineId:
      name: pipelineId
      in: query
      schema:
        type: string
        format: uuid
    DashboardTeamId:
      name: teamId
      in: query
      schema:
        type: string
        format: uuid
    DashboardUserId:
      name: userId
      in: query
      description: User UUID or unassigned for leads without a current assignee.
      schema:
        oneOf:
          - type: string
            format: uuid
          - type: string
            const: unassigned
    DashboardSource:
      name: source
      in: query
      schema:
        type: string
        maxLength: 4096
    DashboardPageId:
      name: pageId
      in: query
      description: Exact Facebook/Meta Page identifier from the same attribution entry as campaign, ad set and ad.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    DashboardCampaignId:
      name: campaignId
      in: query
      description: Legacy single campaign identifier or name; combine with campaignIds using OR.
      schema:
        type: string
        maxLength: 255
    DashboardCampaignIds:
      name: campaignIds
      in: query
      description: Repeat for each campaign identifier or name. A lead or arrival matches any selected campaign on the same attribution entry as page, ad set and ad.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 255
    DashboardAdSetId:
      name: adSetId
      in: query
      schema:
        type: string
    DashboardAdId:
      name: adId
      in: query
      schema:
        type: string
    DashboardTagId:
      name: tagId
      in: query
      schema:
        type: string
        format: uuid
    DashboardTagIds:
      name: tagIds
      in: query
      description: Comma-separated tag UUIDs. A lead matches when it has any selected tag.
      schema:
        type: string
    DashboardDealStatus:
      name: dealStatus
      in: query
      schema:
        type: string
        enum: [open, won, lost]
    DashboardSearchQuery:
      name: searchQuery
      in: query
      schema:
        type: string
    MarketingAnalyticsDateFrom:
      name: dateFrom
      in: query
      required: true
      description: Inclusive first calendar day of the attribution cohort.
      schema:
        type: string
        format: date
    MarketingAnalyticsDateTo:
      name: dateTo
      in: query
      required: true
      description: Inclusive last calendar day of the attribution cohort.
      schema:
        type: string
        format: date
    SiteAnalyticsDateFrom:
      name: dateFrom
      in: query
      description: Inclusive first calendar day. May be omitted only when dateTo is also omitted.
      schema:
        type: string
        format: date
    SiteAnalyticsDateTo:
      name: dateTo
      in: query
      description: Inclusive last calendar day. May be omitted only when dateFrom is also omitted.
      schema:
        type: string
        format: date
    AnalyticsCampaignIds:
      name: campaignIds
      in: query
      description: Repeat identifiers or names; selected campaigns and the legacy single campaign use OR. Commas remain part of each value.
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 255
      style: form
      explode: true
    AnalyticsCampaignId:
      name: campaignId
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 255
    AnalyticsPageId:
      name: pageId
      in: query
      description: Facebook Page ID for exact CRM attribution and page-scoped Meta facts.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    MarketingAccountId:
      name: accountId
      in: query
      description: Meta ad account identifier. The tenant boundary is always taken from the authenticated organization header.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    MarketingObjective:
      name: objective
      in: query
      description: Exact Meta campaign objective stored in the daily Marketing facts.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    AnalyticsAdSetId:
      name: adSetId
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 255
    AnalyticsAdId:
      name: adId
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 255
    AnalyticsTeamId:
      name: teamId
      in: query
      schema:
        type: string
        format: uuid
    AnalyticsUserId:
      name: userId
      in: query
      schema:
        oneOf:
          - type: string
            format: uuid
          - type: string
            const: unassigned
      description: Current assignee UUID or unassigned for leads without an assignee.
    AnalyticsSource:
      name: source
      in: query
      description: CRM acquisition source. Meta aliases are `meta`, `meta_ads`, `facebook` and `instagram`.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    AnalyticsTagId:
      name: tagId
      in: query
      schema:
        type: string
        format: uuid
    AnalyticsTagIds:
      name: tagIds
      in: query
      description: Comma-separated tag UUIDs. A lead matches when it has any selected tag.
      schema:
        type: string
    AnalyticsDealStatus:
      name: dealStatus
      in: query
      schema:
        type: string
        enum: [open, won, lost]
  responses:
    APIError:
      description: Standard API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
    ChavesNaMaoHomologationRequired:
      description: >-
        The Chaves na Mão channel is intentionally fail-closed until official
        homologation is enabled. The error code is
        `chaves_na_mao_homologation_required`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChavesNaMaoHomologationRequiredErrorEnvelope"
  schemas:
    PropertyPortfolioType:
      type: string
      enum: [ready, launch, third_party]
      description: >-
        Create and update accept portfolio_type, third_party_kind (partner or
        private_owner, required for third_party), partner_name (required for
        partner), partner_contact (hidden like owner contacts),
        commission_split_percent (0 to 100, managers only) and
        third_party_authorized_until (YYYY-MM-DD, managers only). Fields a request
        omits keep their stored value.
    PortfolioSettings:
      type: object
      additionalProperties: false
      description: Stored only; does not change publication or edit behaviour yet.
      properties:
        general: { type: object }
        ready: { type: object }
        launches: { type: object }
        rentals: { type: object }
        third_party: { type: object }
        condominiums: { type: object }
        locations: { type: object }
        owners: { type: object }
        keys: { type: object }
        publication: { type: object }
    PortfolioSettingsResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [settings, revision, updated_at, updated_by]
          properties:
            settings:
              $ref: "#/components/schemas/PortfolioSettings"
            revision:
              type: integer
              minimum: 0
            updated_at:
              type: [string, "null"]
              format: date-time
            updated_by:
              type: [string, "null"]
              format: uuid
    UpdatePortfolioSettingsRequest:
      type: object
      additionalProperties: false
      required: [settings, revision]
      properties:
        settings:
          $ref: "#/components/schemas/PortfolioSettings"
        revision:
          type: integer
          minimum: 0
    PropertyKeyMovementPage:
      type: object
      required: [data, next_cursor, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, property_key_id, key_name, movement_type, actor_name, holder_name, reason, notes, from_location, to_location, occurred_at, expected_return_at]
            properties:
              id: { type: string, format: uuid }
              property_key_id: { type: string, format: uuid }
              key_name: { type: string }
              movement_type: { type: string }
              actor_name: { type: [string, "null"] }
              holder_name: { type: [string, "null"] }
              reason: { type: [string, "null"] }
              notes: { type: [string, "null"] }
              from_location: { type: [string, "null"] }
              to_location: { type: [string, "null"] }
              occurred_at: { type: string, format: date-time }
              expected_return_at: { type: [string, "null"], format: date-time }
        next_cursor:
          type: [string, "null"]
        meta:
          type: object
          required: [can_view_key_custody]
          properties:
            can_view_key_custody:
              type: boolean
    ScheduleDashboardResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
          required: [report_timezone, period, kpis, daily, hourly, weekly, by_type, by_source, by_outcome, upcoming_events, overdue_by_owner, performer_ranking, top_performers]
          properties:
            report_timezone: {type: string}
            period: {type: object, additionalProperties: true}
            kpis: {type: object, additionalProperties: true}
            daily:
              type: array
              items:
                type: object
                additionalProperties: true
                properties:
                  date: {type: string, format: date}
                  total: {type: integer}
                  eligible: {type: integer, description: Additive. Base of the completion rate on that day.}
            hourly: {type: array, items: {type: object, additionalProperties: true}}
            hour_distribution:
              type: array
              maxItems: 24
              description: Additive. All 24 hours of the report timezone, over the whole period.
              items:
                type: object
                required: [hour, total]
                properties:
                  hour: {type: integer, minimum: 0, maximum: 23}
                  total: {type: integer}
            weekly: {type: array, description: Kept for compatibility; always empty., items: {type: object, additionalProperties: true}}
            by_type:
              type: array
              items:
                type: object
                additionalProperties: true
                required: [key, count]
                properties:
                  key: {type: string}
                  count: {type: integer}
                  completed: {type: integer, description: Additive.}
            by_source:
              type: array
