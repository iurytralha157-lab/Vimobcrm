  /v1/properties/{id}/assets/upload-intents:
    post:
      summary: Create a two-hour signed upload intent for the private property bucket
      description: >-
        The binary is uploaded directly to Supabase Storage. The API authorizes the
        property, allocates the future asset UUID in the canonical object path and
        returns a signed upload token. Because the Storage token can be replayed until
        it expires, the API retains the reservation and object path as a tombstone
        through expiry plus a five-minute safety margin. Videos and virtual tours
        remain URL-based.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyAssetUploadIntentRequest"
      responses:
        "201":
          description: Signed upload intent created.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PropertyWorkspaceCacheControl"
            Vary:
              $ref: "#/components/headers/PropertyWorkspaceVary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyAssetUploadIntentResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
    delete:
      summary: Discard an unattached private property upload
      description: >-
        Marks the upload reservation for cleanup. Physical object removal is deferred
        until the signed token has expired plus a five-minute safety margin, so a
        replay cannot recreate an orphan at a newly freed path. Repeating the request
        for an already-discarded path is safe. A path that is already attached to a
        canonical asset must be removed through the asset endpoint instead.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscardPropertyAssetUploadRequest"
      responses:
        "200":
          description: The private upload was scheduled for safe discard or was already absent.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PropertyWorkspaceCacheControl"
            Vary:
              $ref: "#/components/headers/PropertyWorkspaceVary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyAssetUploadDiscardResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
