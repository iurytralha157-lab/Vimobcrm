    DashboardCreativePoint:
      type: object
      required: [key, attributionLevel, creativeId, adId, name, campaignName, campaignCount, leadCount, entryCount, thumbnailUrl, imageUrl, videoUrl, instagramUrl, permalinkUrl, isVideo]
      properties:
        key:
          type: string
          description: Stable creative ID or fallback ad ID with a type prefix.
        attributionLevel:
          type: string
          enum: [creative, ad]
        creativeId:
          type: [string, "null"]
        adId:
          type: [string, "null"]
          description: Null when a creative is associated with multiple ads.
        name:
          type: string
        campaignName:
          type: [string, "null"]
          description: A recorded campaign name, if available; see campaignCount for multi-campaign use.
        campaignCount:
          type: integer
          format: int64
          description: Distinct campaigns attributed to this creative in the cohort.
        leadCount:
          type: integer
          format: int64
          description: Distinct leads with an attributed arrival for this creative.
        entryCount:
          type: integer
          format: int64
          description: Initial arrivals and countable reentries for this creative.
        thumbnailUrl:
          type: [string, "null"]
