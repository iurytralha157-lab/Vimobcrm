  /v1/pipelines/{id}:
    patch:
      summary: Update a pipeline
      description: >-
        Send expectedRevision from the original edit snapshot. The opaque SHA256
        revision covers pipeline metadata and all stages, including archived
        stages. Comparison runs after organization, pipeline and ordered stage
        locks, before changing data. Missing or stale revision returns
        pipeline_changed (409); malformed revision returns 400. Do not retry or
        rebase automatically: reload and review the draft explicitly.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePipelineRequest"
      responses:
        "200":
          description: Pipeline updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Pipeline"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
    delete:
      summary: Delete a pipeline without leads
      description: >-
        Send the exact opaque revision captured when opening the deletion
        confirmation. Pipeline metadata or stage creation, editing, reordering
        and deletion invalidate that snapshot. Missing or stale revision returns
        pipeline_changed (409) before deletion or cascades. Existing permission,
        lead and dependency guards remain in force. Never automatically retry
        or replace the confirmation revision after a refetch.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletePipelineRequest"
      responses:
        "204":
          description: Pipeline deleted.
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
