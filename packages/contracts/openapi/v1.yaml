      summary: Request publication of the current property revision on the organization site
      description: >-
        Validates site-specific readiness, creates an immutable snapshot version
        and enqueues an idempotent publication job. A stale property revision or
        an Idempotency-Key reused with another payload returns 409.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
