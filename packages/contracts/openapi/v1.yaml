          type: [integer, "null"]
          minimum: 0
          maximum: 3650
        target_stage_id:
          type: [string, "null"]
          format: uuid
        whatsapp_template:
          type: [string, "null"]
        alert_message:
          type: [string, "null"]
        target_user_id:
          type: [string, "null"]
          format: uuid
        deal_status:
          type: [string, "null"]
          enum: [open, won, lost, null]
        action_config:
          type: [object, "null"]
          additionalProperties: true
        is_active:
          type: boolean
    StageAutomationStatusRequest:
      type: object
      additionalProperties: false
      required: [is_active, expected_updated_at]
      properties:
        is_active:
          type: boolean
        expected_updated_at:
          type: string
          format: date-time
          description: Exact displayed updated_at, preserving fractional precision.
    StageAutomationEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, organization_id, stage_id, trigger_type, is_active, updated_at]
          properties:
            id:
              type: string
              format: uuid
            organization_id:
              type: string
              format: uuid
            stage_id:
              type: string
              format: uuid
            trigger_type:
              type: string
            config: {}
            is_active:
              type: boolean
            created_at:
              type: string
            updated_at:
              type: string
              format: date-time
              description: UTC RFC3339 timestamp preserving PostgreSQL microseconds; reuse verbatim for the next intentional edit.
            inactivity_runtime_available:
              type: boolean
            inactivity_policy:
              type: [object, "null"]
              additionalProperties: true
    CreateStageRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        color:
          type: string
          maxLength: 20
    UpdateStageRequest:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt]
      minProperties: 2
      properties:
        expectedUpdatedAt:
          type: string
          format: date-time
          description: Exact updatedAt captured when editing began, preserving fractional precision. Never rebase an unsaved draft automatically.
        name:
          type: string
          minLength: 2
          maxLength: 120
        color:
          type: string
          maxLength: 20
        stageKey:
          type: string
          maxLength: 80
        isWon:
          type: boolean
        isLost:
          type: boolean
        isQualified:
          type: boolean
          description: Cannot be true together with isWon, isLost, or isActive=false.
        isActive:
          type: boolean
    ReorderStagesRequest:
      type: object
      additionalProperties: false
      required: [stages]
      properties:
        preserveStageKeys:
          type: boolean
          description: >-
            When true, preserve the exact stored key of every existing stage,
            including legacy keys longer than 80 characters, regardless of an
            explicit stageKey. New editors send true and omit existing keys.
            An older strict API rejects this unknown property before mutation;
            deploy the API before the new editor. If omitted or false, explicit
            legacy updates remain supported; an omitted existing key is preserved.
        stages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
                minLength: 2
                maxLength: 120
              color:
                type: string
              stageKey:
                type: string
                maxLength: 80
                description: >-
                  Optional explicit alias. Oversized values are rejected, never
                  truncated. Omit for existing stages to retain their exact key.
                  New aliases are bounded and made unique within the pipeline,
                  including archived stages, while reserving space for suffixes.
              isNew:
                type: boolean
                description: True only for client-generated UUIDs not yet persisted.
              expectedUpdatedAt:
                type: string
                format: date-time
                description: Original exact revision, including microseconds; required for existing stages and forbidden for new stages.
