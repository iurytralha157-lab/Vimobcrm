  /v1/dashboard/sources:
    get:
      summary: Get dashboard card or arrival counts by source
      description: >-
        By default, groups visible lead cards by their current source and
        creation date for older clients. Set countEntries=true to group the
        same initial arrivals and countable reentries as stats.totalEntries.
        Entry mode uses each arrival's date and source/page/campaign/ad
        attribution; current card ownership, team, pipeline, status, tags and
        visibility still apply. Entries without a recorded source are returned
        as "Não informada" with an empty rawSource, separate from "manual".
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: countEntries
          in: query
          description: Opt in to entry counts. Omitted or false preserves card counts.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardCampaignIds"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Source data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSourcesResponse"
  /v1/dashboard/campaigns:
    get:
      summary: Get visible leads by attributed campaign
      description: >-
        Groups all campaigns with initial arrivals or countable reentries in
        the selected period, without truncation. Each campaign counts a lead
        once even when it has multiple arrivals there; the same lead may count
        in multiple campaigns. The separate unattributed count covers arrivals
        without a campaign. Attribution, source, page and ad filters apply to
        each arrival; current card ownership, team, pipeline, status, tags and
        visibility apply to the lead.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardCampaignIds"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Campaign counts for the selected dashboard cohort.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCampaignsResponse"
  /v1/dashboard/creatives:
    get:
      summary: Get up to ten Meta creatives with the most visible leads
      description: >-
        Ranks distinct leads per creative ID, falling back to ad ID when the
        creative ID was not recorded. Only initial arrivals and countable
        reentries with recorded Meta provider or leadgen evidence participate;
        a customized lead source does not remove a Meta arrival. All Dashboard filters
        apply to the same arrival and current visible card scope as the
        campaigns chart. Returns safe HTTPS image, video and post URLs when
        recorded on an arrival. A creative used in multiple campaigns includes
        one recorded campaign name and the distinct campaign count. Creatives
        without any attributed arrival are not included.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardCampaignIds"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Up to ten attributed creatives in the selected cohort.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCreativesResponse"
  /v1/dashboard/creative-media:
    get:
      summary: Refresh a visible Meta creative preview after an image fails
      description: >-
        Validates the key against the same visible card and filtered arrival
        cohort as the creatives ranking, then makes a bounded read-only Graph
        lookup with an active ads_read integration of the organization. Returns
        nullable safe HTTPS URLs and never exposes the provider credential.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: key
          in: query
          required: true
          schema:
            type: string
            pattern: '^(creative|ad):[0-9]{1,32}$'
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardCampaignIds"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Current media URLs when Graph has an accessible preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCreativeMediaResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
  /v1/dashboard/top-brokers:
    get:
      summary: Get top brokers from visible closed leads
      description: >-
        Requires an active session and the existing dashboard and team/all-lead
        permissions. Commercial ranking access does not grant financial access.
        totalCommissions is null without the existing financial module/read
        authorization, and for other brokers when the viewer can only read
        their own commissions. Financial managers retain access to amounts
        within the same visible, filtered lead cohort. Authorized fallback
        values remain zero; unauthorized values remain null.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardCampaignIds"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Top brokers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardTopBrokersResponse"
  /v1/dashboard/lead-distribution:
    get:
      summary: Get visible lead counts by current assignee and current team membership
      description: >-
        Available only to organization owners, administrators and team leaders.
        Both dimensions select visible leads by created_at (origin date). User
        counts respect every dashboard filter, including teamId, and include
        eligible active users with zero leads. The team dimension ignores only
        teamId and preserves the other filters. It attributes each lead to every
        active team of its current assignee, including leads assigned directly
        to that assignee. A lead can therefore count in multiple teams. Active
        authorized teams appear with zero when they have no matching leads.
        totalLeads is the sum of user buckets and need not equal the sum of team
        buckets. Leads without an assignee appear as Sem responsável in users.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardCampaignIds"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Lead distribution by current assignee and active team membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardLeadDistributionResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /v1/dashboard/first-contact:
    get:
      summary: Get first human contact and redistribution performance
      description: >-
        Available only to organization owners, administrators and team leaders.
        All dashboard filters, including dateFrom and dateTo, select the visible
        lead cohort by the lead's created_at (origin date). The average is based
        on recorded human first contacts, grouped by the responding broker;
        leads without a valid recorded human first response are excluded from the average.
        A prior automated response can prevent a later human action from appearing
        in this write-once metric. Redistribution counts
        include successful automatic transfers away from and to each broker.
        No individual lead details are returned.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardCampaignIds"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: First contact and redistribution aggregates for the selected lead cohort.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardFirstContactResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /v1/dashboard/first-contact/leads:
    get:
      summary: List measured first human responses by broker
      description: Bounded drill-down for a response actor in the visible lead creation-date cohort.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardCampaignIds"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
        - name: brokerId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        "200":
          description: Paginated measured first responses for a permitted broker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardFirstContactLeadPageResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /v1/dashboard/upcoming-tasks:
    get:
      summary: Get upcoming open lead tasks
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        "200":
          description: Upcoming tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUpcomingTasksResponse"
  /v1/dashboard/deals-evolution:
    get:
      summary: Get dashboard deals evolution chart data
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardCampaignIds"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Deals evolution data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardDealsEvolutionResponse"
  /v1/dashboard/extra-counts:
    get:
      summary: Get property, site-session and scheduled-visit KPI counts
      description: >-
        The three counters have distinct populations: properties follow property
        visibility, site sessions follow site tracking and property scope, and
        scheduled visits/reunions use their creation date plus visible leads
        and Agenda event privacy. The scheduled-visits total equals the total
        returned by /v1/dashboard/visits for the same filters.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardCampaignIds"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Additional dashboard counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardExtraCountsResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /v1/schedule/dashboard:
    get:
      summary: Get the Agenda dashboard report for the visible events of a period
      description: >-
        All series aggregate the same events, limited to the active organization,
        Agenda event privacy and lead visibility. `hourly` exists only for
        single-day periods; `hour_distribution` covers any period, without
        all-day events on the scheduled-date basis. Fields documented here as
        additive may be absent while an older API replica is still serving.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - {name: dateFrom, in: query, required: true, schema: {type: string, format: date}}
        - {name: dateTo, in: query, required: true, schema: {type: string, format: date}, description: At most 366 days after dateFrom.}
        - {name: dateBasis, in: query, schema: {type: string, enum: [start_time, created_at, completed_at], default: start_time}}
        - {name: teamId, in: query, schema: {type: string, format: uuid}}
        - {name: userId, in: query, schema: {type: string, format: uuid}}
        - {name: source, in: query, schema: {type: string, maxLength: 160}}
        - {name: eventType, in: query, schema: {type: string, enum: [call, email, meeting, task, message, visit]}}
        - {name: status, in: query, schema: {type: string, enum: [scheduled, completed, cancelled, no_show, overdue, upcoming]}}
      responses:
        "200":
          description: Agenda dashboard report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleDashboardResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /v1/schedule/dashboard/events:
    get:
      summary: List the events behind the Agenda dashboard, one page at a time
      description: >-
        Accepts the filters of /v1/schedule/dashboard. Lead stage and source are
        present only when the viewer may see the linked lead.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - {name: dateFrom, in: query, required: true, schema: {type: string, format: date}}
        - {name: dateTo, in: query, required: true, schema: {type: string, format: date}}
        - {name: dateBasis, in: query, schema: {type: string, enum: [start_time, created_at, completed_at], default: start_time}}
        - {name: teamId, in: query, schema: {type: string, format: uuid}}
        - {name: userId, in: query, schema: {type: string, format: uuid}}
        - {name: source, in: query, schema: {type: string, maxLength: 160}}
        - {name: eventType, in: query, schema: {type: string, enum: [call, email, meeting, task, message, visit]}}
        - {name: status, in: query, schema: {type: string, enum: [scheduled, completed, cancelled, no_show, overdue, upcoming]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
      responses:
        "200":
          description: One page of events, ordered by start time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleDashboardEventsResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /v1/dashboard/visits:
    get:
      summary: Explain the scheduled-visit KPI with visits, alerts and rankings
      description: >-
        Counts visit and meeting events created in the optional period,
        associated with visible leads and events permitted by Agenda privacy.
        Lead filters include pipeline, current assignee/team, origin, Meta page,
        campaign, ad set, ad, tags, deal status and search. Upcoming and overdue
        are subsets of those same events; all-day overdue status uses the
        organization timezone. Returns at most 100 newest events, 20 upcoming,
        20 overdue, 50 authors and 50 origins while totals remain complete.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/DashboardDateFrom"
        - $ref: "#/components/parameters/DashboardDateTo"
        - $ref: "#/components/parameters/DashboardPipelineId"
        - $ref: "#/components/parameters/DashboardTeamId"
        - $ref: "#/components/parameters/DashboardUserId"
        - $ref: "#/components/parameters/DashboardSource"
        - $ref: "#/components/parameters/DashboardPageId"
        - $ref: "#/components/parameters/DashboardCampaignId"
        - $ref: "#/components/parameters/DashboardCampaignIds"
        - $ref: "#/components/parameters/DashboardAdSetId"
        - $ref: "#/components/parameters/DashboardAdId"
        - $ref: "#/components/parameters/DashboardTagId"
        - $ref: "#/components/parameters/DashboardTagIds"
        - $ref: "#/components/parameters/DashboardDealStatus"
        - $ref: "#/components/parameters/DashboardSearchQuery"
      responses:
        "200":
          description: Visits matching the KPI scope and their operational detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardVisitsResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /v1/analytics/meta-insights:
    get:
      summary: Get tenant scoped Meta daily insights
      parameters:
        - $ref: '#/components/parameters/OrganizationIdHeader'
        - $ref: '#/components/parameters/SiteAnalyticsDateFrom'
        - $ref: '#/components/parameters/SiteAnalyticsDateTo'
        - $ref: '#/components/parameters/AnalyticsCampaignId'
        - $ref: '#/components/parameters/AnalyticsCampaignIds'
        - $ref: '#/components/parameters/AnalyticsAdSetId'
        - $ref: '#/components/parameters/AnalyticsAdId'
      responses:
        '200':
          description: Filtered result within the authenticated organization and permission scope.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        default:
          $ref: '#/components/responses/APIError'
  /v1/automation-executions:
    get:
      summary: List server filtered automation executions
      description: Requires the automations module and automations_view permission.
      parameters:
        - $ref: '#/components/parameters/OrganizationIdHeader'
        - name: automationId
          in: query
          schema:
            type: string
            format: uuid
        - name: leadId
          in: query
          schema:
            type: string
            format: uuid
        - name: activeOnly
          in: query
          schema:
            type: boolean
            default: false
        - name: status
          in: query
          description: Running groups queued, running and waiting.
          schema:
            type: string
            enum:
              - all
              - running
              - queued
              - waiting
              - completed
              - failed
              - cancelled
              - canceled
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: dateFrom
          in: query
          description: Inclusive execution start timestamp.
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          description: Inclusive upper timestamp; must not precede dateFrom.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Filtered result within the authenticated organization and permission scope.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        default:
          $ref: '#/components/responses/APIError'
  /v1/automation-media:
    get:
      summary: Search automation media before pagination
      description: Requires automations_view. Search is applied to Storage listing before offset and limit.
      parameters:
        - $ref: '#/components/parameters/OrganizationIdHeader'
        - name: mediaType
          in: query
          schema:
            type: string
            enum:
              - image
              - video
              - audio
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Filtered result within the authenticated organization and permission scope.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - files
                      - nextOffset
                    properties:
                      files:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      nextOffset:
                        type:
                          - integer
                          - 'null'
                        minimum: 0
        default:
          $ref: '#/components/responses/APIError'
  /v1/whatsapp/conversations:
    get:
      summary: List filtered WhatsApp conversations
      description: Requires the WhatsApp module and whatsapp_view permission. Lead and session visibility are enforced by the server. Without lead cannot combine with lead dimensions.
      parameters:
        - $ref: '#/components/parameters/OrganizationIdHeader'
        - name: sessionId
          in: query
          schema:
            type: string
            format: uuid
        - name: sessionIds
          in: query
          description: Comma separated accessible session UUIDs. Explicitly empty scope fails closed.
          schema:
            type: string
        - name: pipelineId
          in: query
          schema:
            type: string
            format: uuid
        - name: teamId
