  /v1/tags:
    get:
      summary: List tags in the active organization
      description: Requires an authenticated organization. Lead counts describe the organization catalog.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Organization tags and their lead counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
        default:
          $ref: "#/components/responses/APIError"
    post:
      summary: Create an organization tag
      description: Requires tag_manage. Duplicate normalized names return tag_already_exists (409).
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: Tag created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "409":
          description: A tag with the normalized name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/tags/{id}:
    patch:
      summary: Update a tag observed at its current revision
      description: Requires tag_manage. A changed revision returns tag_changed (409); duplicate names return tag_already_exists (409).
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTagRequest"
      responses:
        "200":
          description: Tag updated with its resulting revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    delete:
      summary: Delete an unchanged tag without configuration references
      description: >-
        Requires tag_manage and the observed tag updated_at in If-Match. References are
        checked again inside the deletion transaction. A changed revision returns
        tag_changed (409); a remaining configuration reference returns tag_in_use (409).
        Leads remain registered and lose only this classification.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
        - $ref: "#/components/parameters/TagRevisionIfMatchHeader"
      responses:
        "204":
          description: Tag and its lead associations removed.
        "400":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/tags/{id}/usage:
    get:
      summary: Check configuration references before deleting a tag
      description: Requires tag_manage. Returns only category counts, without names or configuration payloads from other management domains.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Current tag revision, associated lead count and live configuration references.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagUsageResponse"
        "400":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/teams:
    get:
      summary: List teams visible to the current user
      description: >-
        Requires `team_view`. Organization-wide readers see all matching teams.
        Team leaders receive only teams they lead, except managers retain
        organization-wide read visibility while their mutations stay within led teams.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: includeInactive
          in: query
          description: Include inactive teams. Defaults to false.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Visible teams in the active organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
        "401":
          $ref: "#/components/responses/APIError"
        "402":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    post:
      summary: Create a team with members and their schedules
      description: >-
        Requires `team_manage`. New members must include a complete seven-day
        availability schedule. `members` and legacy `memberIds` cannot be sent
        together, including as empty arrays.
        Reuse the same Idempotency-Key for the same creation attempt after a lost
        response; another payload or a removed prior result returns 409.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/ManagementIdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "402":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/teams/logo:
    post:
      summary: Upload a team logo through the backend
      description: >-
        Requires `team_manage`. The backend detects the file content and accepts
        JPEG, PNG, WebP or GIF images up to 5 MiB; SVG and MIME-only claims are rejected.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG, WebP or GIF image up to 5 MiB.
      responses:
        "201":
          description: Team logo uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamLogoUploadResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "402":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "500":
          $ref: "#/components/responses/APIError"
        "502":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/teams/{id}:
    get:
      summary: Get a visible team
      description: Requires `team_view` and visibility over the requested team.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Team details with active members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "402":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
    patch:
      summary: Update a team and its member schedules
      description: >-
        Requires `team_manage`. Member replacements are atomic with their supplied
        schedules. `preserveLeadership` prevents removal or demotion of current leaders.
        The request must echo the `revision` last read from the team. A stale
        revision or visible member list returns `409 team_revision_conflict`
        without changing the team, members, availability, or linked distribution
        queues. Replacing members also requires `expected_member_ids`, the visible
        `Team.members[].id` values from that same read, because organization removal
        can invalidate a member without advancing the team revision.
        `members` and legacy `memberIds` are mutually exclusive, even when
        either list is empty.
        A legacy linked queue whose materialized participation would grow above
        500 entries, or exhaust its integer positions, returns `409 team_queue_sync_blocked`
        and rolls back the entire team change without converting weights or bindings.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: Team updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "402":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          description: The team snapshot changed, or a linked legacy queue cannot safely grow within its participant/position limits.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TeamRevisionConflictErrorEnvelope"
                  - $ref: "#/components/schemas/TeamQueueSyncErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
    delete:
      summary: Delete a team not used by a distribution queue
      description: Requires `team_manage`. A referenced team returns `409 team_in_use`.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      responses:
        "204":
          description: Team deleted.
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "402":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/teams/{id}/history:
