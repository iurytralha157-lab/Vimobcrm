  /v1/properties/{id}:
    get:
      summary: Get a property in the current organization
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Property detail.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PropertyWorkspaceCacheControl"
            Vary:
              $ref: "#/components/headers/PropertyWorkspaceVary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyResponse"
        "404":
          $ref: "#/components/responses/APIError"
    patch:
      summary: Update a property in the current organization
      description: >-
        Requires optimistic concurrency through expected_updated_at. A missing
        or stale version is rejected so one editor cannot silently overwrite a
        newer property change.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
