  /v1/analytics/campaign-insights:
    get:
      summary: Get consolidated Meta Ads and CRM campaign performance
      description: >-
        Returns daily paid-media facts joined to the last Meta attribution for each
        lead in the requested cohort. Both dates are required and the inclusive
        range cannot exceed 366 calendar days. When pageId is selected, CRM leads
        match the same last-touch entry, while paid metrics include only ad-level
        facts explicitly associated with that Facebook Page; historical coverage
        may therefore be partial.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/MarketingAnalyticsDateFrom"
        - $ref: "#/components/parameters/MarketingAnalyticsDateTo"
        - $ref: "#/components/parameters/MarketingAccountId"
        - $ref: "#/components/parameters/MarketingObjective"
        - $ref: "#/components/parameters/AnalyticsPageId"
        - $ref: "#/components/parameters/AnalyticsCampaignId"
        - $ref: "#/components/parameters/AnalyticsAdSetId"
        - $ref: "#/components/parameters/AnalyticsAdId"
        - $ref: "#/components/parameters/AnalyticsTeamId"
        - $ref: "#/components/parameters/AnalyticsUserId"
        - $ref: "#/components/parameters/AnalyticsSource"
        - $ref: "#/components/parameters/AnalyticsTagId"
        - $ref: "#/components/parameters/AnalyticsTagIds"
        - $ref: "#/components/parameters/AnalyticsDealStatus"
        - $ref: '#/components/parameters/AnalyticsCampaignIds'
        - name: pipelineId
          in: query
          description: Current CRM pipeline; applied after canonical last Meta touch and reflected in CRM scoped metadata.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Consolidated paid-media, CRM attribution and Meta connection analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketingCampaignInsightsResponse"
        "400":
          description: Dates or UUID filters are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "503":
          description: Marketing schema, database capacity or query processing is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/analytics/lead:
    get:
      summary: Get public-site visitor journeys and lead conversion analytics
      description: >-
        Returns up to 100 recent visitor journeys plus funnel, page, device and
        geolocation aggregates. Without dates the backend uses the current seven-day
        period. Explicit dates must be supplied together and the inclusive range
        cannot exceed 366 calendar days.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/SiteAnalyticsDateFrom"
        - $ref: "#/components/parameters/SiteAnalyticsDateTo"
      responses:
        "200":
          description: Visitor journey and conversion analytics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadAnalyticsResponse"
        "400":
          description: Date filters are invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/analytics/site-summary:
    get:
      summary: Get public-site analytics summary
      description: >-
        Returns page, session, duration, device, acquisition and conversion totals
        for the requested period and its immediately preceding comparison period.
        Without dates the backend uses the current seven-day period.
        Supplying only one date is invalid; explicit ranges are inclusive and limited
        to 366 calendar days.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/SiteAnalyticsDateFrom"
        - $ref: "#/components/parameters/SiteAnalyticsDateTo"
