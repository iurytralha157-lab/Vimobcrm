          type: [string, "null"]
          maxLength: 2000
        is_active:
          type: boolean
          default: true
    UpdateTeamRequest:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [expected_revision]
      not:
        required: [members, memberIds]
      dependentRequired:
        members: [expected_member_ids]
        memberIds: [expected_member_ids]
      anyOf:
        - required: [name]
        - required: [memberIds]
        - required: [members]
        - required: [logo_url]
        - required: [is_active]
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Team revision obtained from the latest GET or successful mutation.
        expected_member_ids:
          type: array
          maxItems: 500
          uniqueItems: true
          description: Current visible Team.members[].id values from the same GET as expected_revision. Required when replacing members; send an empty array for a team with no visible members.
          items:
            type: string
            format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        memberIds:
          type: array
          maxItems: 500
          deprecated: true
          description: Legacy member list without schedule details. Prefer members.
          items:
            type: string
            format: uuid
        members:
          type: array
          maxItems: 500
          description: New members require availability; existing members may omit it to preserve their schedule.
          items:
            $ref: "#/components/schemas/TeamMemberMutation"
        logo_url:
          type: [string, "null"]
          maxLength: 2000
        is_active:
          type: boolean
        preserveLeadership:
          type: boolean
          default: false
