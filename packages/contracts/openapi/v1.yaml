          description: Lead deleted.
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
  /v1/leads/{id}/attachment-uploads:
    post:
      summary: Upload a document to an authorized lead with a durable receipt
      description: >-
        Requires lead_operate and resource access checked under lock. Reuse the
        same uploadRequestKey for a retry of the same file and lead. The receipt
        is scoped to organization and actor; changed content returns 409.
        Unknown commit outcomes retain the tracked object for an exact retry.
        Missing receipt storage returns 503 before touching Storage. Apply the
        reviewed receipt migration before releasing the new upload client.
        This receipt-specific URL returns 404 on older replicas without writing
        a file. The legacy /attachments URL remains registered for compatibility
        and also requires a receipt key on the updated backend.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, uploadRequestKey]
              properties:
                file:
                  type: string
                  format: binary
                  description: Nonempty file, at most 25 MiB. The server derives content type and object path.
                uploadRequestKey:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Attachment persisted or its completed receipt replayed. Signing availability is separate from persistence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadAttachmentEnvelope"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          description: lead_attachment_upload_conflict; key reused with different lead or file content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "503":
          $ref: "#/components/responses/APIError"
  /v1/internal/automations/stage-command:
    post:
      summary: Apply a fenced automation move through the canonical Leads transaction
      description: Server-only command. Loads destination and lost reason from the immutable published node, resolves current author permissions, and commits the commercial effects and idempotent ledger together. Does not accept a lead payload or caller-provided capability.
      security:
        - automationCommandToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organizationId, executionId, nodeKey, leaseToken, effectKey]
              properties:
                organizationId: { type: string, format: uuid }
                executionId: { type: string, format: uuid }
                nodeKey: { type: string, minLength: 1, maxLength: 200 }
                leaseToken: { type: string, minLength: 1, maxLength: 512, writeOnly: true }
                effectKey:
                  type: string
                  maxLength: 512
                  description: Must equal automation:<executionId>:<nodeKey>:move_lead. Retain this key after an ambiguous response.
      responses:
        "200":
          description: Transaction committed, or its exact bound recorded result acknowledged after current author and module authorization. An acknowledgement can follow cursor advancement or cancellation and never executes the effect again.
          content:
            application/json:
              schema:
                type: object
                required: [ok, status, effect_id, response]
                properties:
                  ok: { const: true }
                  status: { const: succeeded }
                  effect_id: { type: string, format: uuid }
                  response: { type: object }
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          description: Lease, execution or bound effect changed; business conflicts keep their canonical error codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "422":
          $ref: "#/components/responses/APIError"
        "503":
          description: Command unavailable or transient failure. Defer the same fenced node with bounded retries; never advance it as a success.
          content:
            application/json:
              schema:
