      responses:
        "200":
          description: Settings saved; revision advanced.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PropertyWorkspaceCacheControl"
            Vary:
              $ref: "#/components/headers/PropertyWorkspaceVary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSettingsResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
  /v1/properties/stats:
    get:
      summary: Get property KPIs for the current organization
      description: >-
        Applies the same validated filters as the property list. Launches have
        their own counter and are not included in the sale counter.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: portfolio_type
          in: query
          description: Portfolio classification. Launch follows the Lancamento deal type.
          schema:
            type: string
            enum: [ready, launch, third_party]
        - name: tipo_de_negocio
          in: query
          schema:
            type: string
            maxLength: 80
        - name: owner_id
          in: query
          schema:
            type: string
            format: uuid
        - name: city_id
          in: query
          description: Canonical city identity; label fallback applies only to rows without a city ID, using the catalog state.
          schema:
            type: string
            format: uuid
        - name: neighborhood_id
          in: query
          description: Canonical neighborhood identity; fallback is scoped to its catalog city and state.
          schema:
            type: string
            format: uuid
        - name: uf
          in: query
          description: Brazilian state for legacy text matching without canonical locality IDs; catalog identity takes precedence when IDs are supplied.
          schema:
            type: string
            pattern: ^[A-Za-z]{2}$
        - name: cidade
          in: query
          description: Exact case and accent insensitive legacy city label.
          schema:
            type: string
            maxLength: 120
        - name: bairro
          in: query
          description: Exact case and accent insensitive legacy neighborhood label.
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Property KPI counters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyStatsResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
  /v1/properties/{id}:
    get:
      summary: Get a property in the current organization
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Property detail.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PropertyWorkspaceCacheControl"
            Vary:
              $ref: "#/components/headers/PropertyWorkspaceVary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyResponse"
        "404":
          $ref: "#/components/responses/APIError"
    patch:
      summary: Update a property in the current organization
      description: >-
        Requires optimistic concurrency through expected_updated_at. A missing
        or stale version is rejected so one editor cannot silently overwrite a
        newer property change.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdateRequest"
      responses:
        "200":
          description: Property updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
    delete:
      summary: Delete a property in the current organization
      description: Requires the last observed property revision to prevent deletion of a newer concurrent edit.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyDeleteRequest"
      responses:
        "204":
          description: Property deleted.
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
  /v1/properties/{id}/workspace:
    get:
      summary: Get the role-aware operational workspace for a property
      description: >-
        Returns an explicit allowlisted projection. Users with property management
        permission receive internal offer data, confidential assets, keys and recent
        key movements. Read-only viewers receive active offers only, no physical-key
        data, and redacted internal terms, metadata and notes. Owner contacts are
        included only when the organization policy allows them.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Role-aware property workspace.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PropertyWorkspaceCacheControl"
            Vary:
              $ref: "#/components/headers/PropertyWorkspaceVary"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyWorkspaceResponse"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
  /v1/properties/{id}/publications:
    get:
      summary: Get the channel publication state and safe preview for a property
      description: >-
        Always returns Site plus Grupo OLX · ZAP · Viva Real, including an
        unavailable virtual Grupo OLX view. Returns channel-specific readiness, immutable published-version state,
        capabilities and recent jobs. The preview is an allowlisted public
        projection and never includes owner, key, token or internal asset-path data.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Publication overview for the property.
