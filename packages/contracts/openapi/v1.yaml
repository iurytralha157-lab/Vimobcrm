        The token derives the active organization and configured defaults. An
        Idempotency-Key header, or event_id, submission_id, leadgen_id or external_id
        in the body, makes retries idempotent. The header takes precedence. Without an
        explicit identity, every request is processed as a distinct lead arrival even
        when its payload is identical.
      security:
        - vimobWebhookBearer: []
        - vimobWebhookHeader: []
      parameters:
        - $ref: "#/components/parameters/GenericWebhookIdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Lead accepted or returned as an identical idempotent replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncomingWebhookLeadResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "401":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
        "413":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/APIError"
  /v1/public/site/contact:
    post:
      summary: Submit a public-site contact request
      description: >-
        Creates or re-enters the organization-scoped lead. submission_id makes
        retries idempotent; the honeypot may return a filtered success without a lead.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicSiteContactRequest"
      responses:
        "200":
          description: Idempotent replay or filtered honeypot submission accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSiteContactResponse"
        "201":
          description: Contact accepted and lead created or re-entered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSiteContactResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "429":
          $ref: "#/components/responses/APIError"
  /v1/public/tracking/events:
