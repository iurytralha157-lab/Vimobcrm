          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        stageKey:
          type: string
        position:
          type: integer
        isWon:
          type: boolean
        isLost:
          type: boolean
        isQualified:
          type: boolean
          description: True only for an active, non-won, non-lost stage.
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeleteStageRequest:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt]
      properties:
        expectedUpdatedAt:
          type: string
          format: date-time
          description: Exact updatedAt from the original confirmation snapshot, preserving fractional precision. Never convert through a JavaScript Date.
    DeleteStageAutomationRequest:
      type: object
      additionalProperties: false
      required: [expected_updated_at]
      properties:
        expected_updated_at:
          type: string
          format: date-time
          description: Exact updated_at from the original confirmation snapshot, preserving fractional precision. Never convert through a JavaScript Date.
    UpdateStageAutomationRequest:
      type: object
      additionalProperties: false
      required: [expected_updated_at]
      minProperties: 2
      properties:
        expected_updated_at:
          type: string
          format: date-time
          description: Exact original updated_at from the API, preserving fractional precision; never convert through a JavaScript Date.
        stage_id:
          type: string
          format: uuid
        automation_type:
          type: string
          description: Rule type required by business validation; on_enter rules support change_assignee_on_enter and change_deal_status_on_enter.
          maxLength: 120
