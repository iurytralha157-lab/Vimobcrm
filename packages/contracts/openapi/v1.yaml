        - name: filterTags
          in: query
          description: Comma-separated tag UUIDs. A lead matches when it has any selected tag.
          schema:
            type: string
        - name: unassigned
          in: query
          description: When true, returns only leads without an assigned user.
          schema:
            type: boolean
        - name: teamId
          in: query
          description: Restricts leads to the selected team; it can be combined with unassigned.
          schema:
            type: string
            format: uuid
        - name: filterPage
          in: query
          description: Exact Facebook/Meta Page identifier carried by the same attribution entry as the other Meta filters.
          schema:
            type: string
            maxLength: 255
        - name: filterCampaign
          in: query
          description: Legacy single campaign; combines with filterCampaigns using OR.
          schema:
            type: string
            maxLength: 255
        - name: filterCampaigns
          in: query
          description: Repeat identifiers or names; selected campaigns and the legacy single campaign use OR. Commas remain part of each value.
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              minLength: 1
              maxLength: 255
