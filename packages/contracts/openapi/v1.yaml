  /v1/leads/{id}/cadence:
    post:
      summary: Switch the active cadence for one open lead
      description: >-
        Requires `lead_operate` and visibility over the lead. The selected
        template must be active, non-empty, compatible with the lead's current
        stage, and allowed by the stage operational rule. The previous active
        enrollment is cancelled and the selected template is snapshotted into
        the current non-historical stage cycle.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchLeadCadenceRequest"
      responses:
        "200":
          description: Lead cadence switched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwitchLeadCadenceEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/stages/{id}/operational-rules:
    get:
      summary: Get cadence and attention rules for a pipeline stage
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Current stage operational rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageOperationalRulesEnvelope"
        default:
          $ref: "#/components/responses/APIError"
    put:
      summary: Replace cadence and attention rules for a pipeline stage
      description: >-
        Requires `pipeline_manage` and saves the rule set atomically. Existing
        open cycles are never backfilled or restarted when a rule is created,
        edited, or re-enabled; the new snapshot starts on the next fresh stage
        cycle. Disabling a currently active stage cadence cancels only its
        outstanding obligations and preserves completed history. The
        `cadence.template_id` field is response-only and is ignored as a
        mutation selector. The body must echo the `revision` returned by the
        latest GET. A stale revision returns
        `409 stage_operational_rules_changed` without overwriting the newer
        configuration.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageOperationalRulesInput"
      responses:
        "200":
          description: Saved stage operational rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageOperationalRulesEnvelope"
        "409":
          $ref: "#/components/responses/APIError"
        default:
          $ref: "#/components/responses/APIError"
  /v1/leads/{id}/cadence-state:
    get:
      summary: Get the lead's current stage cadence state
      description: >-
        Returns only the enrollment and materialized tasks for the current
        stage cycle. Closed deals return their latest relevant cycle for audit.
      parameters:
