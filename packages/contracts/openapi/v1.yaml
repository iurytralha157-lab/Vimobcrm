          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyDevelopmentReservationResponse"
        "400":
          $ref: "#/components/responses/APIError"
        "403":
          $ref: "#/components/responses/APIError"
        "404":
          $ref: "#/components/responses/APIError"
        "409":
          $ref: "#/components/responses/APIError"
  /v1/property-developments/{developmentId}/reservations/{reservationId}/extend:
