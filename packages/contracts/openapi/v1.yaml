        - leadsLost
        - openLeads
        - lostLeads
        - conversionRate
        - closedLeads
        - wonAverageConversionDays
        - wonConversionBuckets
        - wonDeals
        - wonDealsTruncated
        - lostReasonBuckets
        - lostDeals
        - lostDealsTruncated
        - avgResponseTime
        - totalSalesValue
        - pendingCommissions
        - leadsTrend
        - openTrend
        - lostTrend
        - conversionTrend
        - closedTrend
        - totalReceivables
        - totalPayables
        - overdueReceivables
        - overduePayables
        - paidCommissions
      properties:
        totalLeads:
          type: integer
          format: int64
          description: Unique cards in the legacy created-at cohort.
        uniqueLeads:
          type: integer
          format: int64
          description: Initial arrivals matching the entry-level date and attribution filters.
        reentries:
          type: integer
          format: int64
          description: Countable reentry events matching the entry-level date and attribution filters.
        totalEntries:
          type: integer
          format: int64
          description: Sum of uniqueLeads and reentries.
        entriesTrend:
          type: integer
          description: Percentage trend of totalEntries against the preceding equal-length period; zero without an explicit period.
        leadsInProgress:
          type: integer
          format: int64
        leadsClosed:
          type: integer
          format: int64
        leadsLost:
          type: integer
          format: int64
        openLeads:
          type: integer
          format: int64
        lostLeads:
          type: integer
          format: int64
        conversionRate:
          type: number
        closedLeads:
          type: integer
          format: int64
        wonAverageConversionDays:
          type: [integer, "null"]
        wonConversionBuckets:
          type: array
          items:
            $ref: "#/components/schemas/WonConversionBucket"
        wonDeals:
          type: array
          description: Empty unless includeDetails=true; then limited to the 100 most recent won leads.
          items:
            $ref: "#/components/schemas/WonDealDetail"
        wonDealsTruncated:
          type: boolean
          description: True when wonDeals omits one or more leads from the exact closedLeads total.
        lostReasonBuckets:
          type: array
          items:
            $ref: "#/components/schemas/LostReasonBucket"
        lostDeals:
          type: array
          description: Empty unless includeDetails=true; then limited to the 100 most recent lost leads.
          items:
            $ref: "#/components/schemas/LostDealDetail"
        lostDealsTruncated:
          type: boolean
          description: True when lostDeals omits one or more leads from the exact lostLeads total.
        avgResponseTime:
          type: string
        totalSalesValue:
          type: number
        pendingCommissions:
          type: number
        leadsTrend:
          type: integer
        openTrend:
          type: integer
        lostTrend:
          type: integer
        conversionTrend:
          type: integer
        closedTrend:
          type: integer
        totalReceivables:
          type: number
        totalPayables:
          type: number
        overdueReceivables:
          type: number
        overduePayables:
          type: number
        paidCommissions:
          type: number
