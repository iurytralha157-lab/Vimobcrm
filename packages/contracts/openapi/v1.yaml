        videoUrl:
          type: [string, "null"]
          description: HTTPS video media URL from the selected recorded arrival; provider URLs may expire.
        instagramUrl:
          type: [string, "null"]
          description: HTTPS Instagram post URL from the selected recorded arrival when available.
        permalinkUrl:
          type: [string, "null"]
          description: HTTPS creative post permalink from the selected recorded arrival when available.
        isVideo:
          type: boolean
          description: Whether the selected arrival describes a video creative.
