  /v1/home/assistant:
    post:
      summary: Search active help-center content for a home-page question
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeAssistantRequest"
      responses:
        "200":
          description: Best matching active help article, or null when no article matches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeAssistantEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/help/articles:
    get:
      summary: List active help articles for the authenticated user
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      responses:
        "200":
          description: Authenticated or shared help articles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpArticleSummaryListEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/help/articles/{slug}:
    get:
      summary: Get one active help article for the authenticated user
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      responses:
        "200":
          description: Complete structured help article.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpArticleEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/help/search:
    post:
      summary: Search active help articles without generative AI
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpSearchRequest"
      responses:
        "200":
          description: Ranked deterministic help results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpArticleSummaryListEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/public/help/articles:
    get:
      summary: List public help articles
      security: []
      responses:
        "200":
          description: Public or shared help articles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpArticleSummaryListEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/public/help/articles/{slug}:
    get:
      summary: Get one public help article
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      responses:
        "200":
          description: Complete public help article.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpArticleEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/home-publications:
    get:
      summary: List all home publications
      description: Superadministrator only.
      responses:
        "200":
          description: All configured home publications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationListEnvelope"
        default:
          $ref: "#/components/responses/APIError"
    post:
      summary: Create a home publication
      description: Superadministrator only. Images are attached through the dedicated image endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomePublicationCreateRequest"
      responses:
        "201":
          description: Home publication created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/home-publications/{id}:
    patch:
      summary: Update a home publication
      description: Superadministrator only. `startsAt` and `endsAt` accept null to clear their values.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomePublicationUpdateRequest"
      responses:
        "200":
          description: Home publication updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationEnvelope"
        default:
          $ref: "#/components/responses/APIError"
    delete:
      summary: Delete a home publication
      description: Superadministrator only. Image cleanup failures are returned as a non-fatal warning.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Home publication deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationDeleteResponse"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/home-publications/order:
    put:
      summary: Reorder home publications atomically
      description: Superadministrator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomePublicationOrderRequest"
      responses:
        "200":
          description: Complete reordered publication list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationListEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/admin/home-publications/{id}/image:
    post:
      summary: Upload or replace a home publication image
      description: Superadministrator only. Accepts JPEG, PNG, or WebP files up to 5 MiB.
      parameters:
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Image attached to the home publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationImageMutationResponse"
        default:
          $ref: "#/components/responses/APIError"
    delete:
      summary: Remove a home publication image
      description: Superadministrator only. Storage cleanup failures are returned as a non-fatal warning.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Image detached from the home publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePublicationImageMutationResponse"
        default:
          $ref: "#/components/responses/APIError"
  /v1/public/integrations/meta/webhook:
    get:
      summary: Verify the backend-owned Meta webhook
      description: Public verification endpoint registered in the Meta app. The backend validates the configured verify token before echoing the challenge.
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
            enum: [subscribe]
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Verification challenge accepted and echoed.
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/APIError"
    post:
      summary: Receive signed Meta lead and messaging events
      description: Public ingress for Meta Lead Ads, Messenger and Instagram. The Go backend verifies X-Hub-Signature-256 against the exact raw body, durably queues the event and resolves its organization from connected server-side integration data.
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
            pattern: '^sha256=[0-9a-fA-F]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Signed event was durably registered for processing.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Signature is missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        "413":
          description: Request body exceeds the backend limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIErrorEnvelope"
        default:
          $ref: "#/components/responses/APIError"
  /v1/public/integrations/meta/oauth/callback:
    get:
      summary: Complete the backend-owned Meta OAuth flow
      description: Public callback registered in the Meta app. Redirects to the allowlisted frontend return URL with only an opaque flow id and status; provider credentials are never returned.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the allowlisted frontend OAuth return URL.
        default:
          $ref: "#/components/responses/APIError"
  /v1/integrations/meta/oauth/actions:
    post:
      summary: Manage a Meta connection through the Go backend
      description: Owner/admin only. Supports get_auth_url, connect_page, update_page, disconnect_page, toggle_page, and update_ad_accounts. Provider codes and tokens are rejected from browser input.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              additionalProperties: true
              properties:
                action:
                  type: string
                  enum: [get_auth_url, connect_page, update_page, disconnect_page, toggle_page, update_ad_accounts]
                return_url:
                  type: string
                  format: uri
                flow_id:
                  type: string
                  format: uuid
                page_id:
                  type: string
      responses:
        "200":
          description: Safe action result without provider credentials.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: "#/components/responses/APIError"
  /v1/integrations/meta/conversion-feedback:
    put:
      summary: Configure CRM funnel feedback for a connected Meta Page
      description: >-
        Requires the campaigns module and settings_integrations permission.
        The CRM Dataset token is write-only, encrypted in Vault before storage,
        and never returned. Enabling affects future funnel events only; no
        historical CRM outcomes are silently delivered to Meta.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [integrationId, enabled]
              properties:
                integrationId:
                  type: string
                  format: uuid
                datasetId:
                  type: [string, "null"]
                  pattern: "^[0-9]{5,30}$"
                datasetName:
                  type: [string, "null"]
                  maxLength: 160
                datasetAccessToken:
                  type: [string, "null"]
                  maxLength: 8192
                  writeOnly: true
                enabled:
                  type: boolean
      responses:
        "200":
          description: Tokenless CRM feedback configuration state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - organization_id
                      - conversion_feedback_enabled
                      - conversion_feedback_status
                    properties:
                      id:
                        type: string
                        format: uuid
                      organization_id:
                        type: string
                        format: uuid
                      page_id:
                        type: string
                      crm_dataset_id:
                        type: string
                      crm_dataset_name:
                        type: string
                      conversion_feedback_enabled:
                        type: boolean
                      conversion_feedback_status:
                        type: string
                        enum: [not_configured, active, paused, error]
                      conversion_feedback_last_sent_at:
                        type: string
                        format: date-time
                      conversion_feedback_last_validated_at:
                        type: string
                        format: date-time
                      conversion_feedback_last_error:
                        type: string
        default:
          $ref: "#/components/responses/APIError"
  /v1/integrations/meta/marketing/sync:
    post:
      summary: Synchronize Meta Ads and Instagram facts
      description: Owner/admin only. Organization and user are always derived from the authenticated tenant context. Meta credentials are loaded by the Go backend from Vault.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [date_start, date_stop]
              properties:
                date_start:
                  type: string
                  format: date
                date_stop:
                  type: string
                  format: date
      responses:
        "200":
          description: Synchronous bounded synchronization result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [success, synced, media_synced, social_synced, errors]
                properties:
                  success:
                    type: boolean
                  synced:
                    type: integer
                  media_synced:
                    type: integer
                  social_synced:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
        default:
          $ref: "#/components/responses/APIError"
  /v1/integrations/meta/pages/{pageId}/forms:
    get:
      summary: List lead forms for a connected Meta Page
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lead forms returned by Meta through the backend.
          content:
            application/json:
              schema:
                type: object
                required: [forms]
                properties:
                  forms:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        default:
          $ref: "#/components/responses/APIError"
  /v1/integrations/meta/conversations/{id}/messages:
    post:
      summary: Send a Messenger or Instagram message
      description: Sender, recipient, platform and Page credential are derived from the tenant-scoped conversation. The browser supplies the text and one UUID generated for this send attempt. The backend durably reserves that UUID before contacting Meta, so replaying it never sends twice.
      parameters:
        - $ref: "#/components/parameters/OrganizationIdHeader"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text, idempotencyKey]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
                idempotencyKey:
                  type: string
                  format: uuid
                  description: Stable client-generated UUID reused by transport retries of this exact send attempt.
      responses:
        "200":
          description: Existing reservation returned without another Meta request, or a definitive failed state was returned safely.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "201":
          description: Provider accepted the message and the backend persisted it.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "202":
          description: The reservation is pending or uncertain. Reusing the same UUID returns this state without contacting Meta again.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: true
        default:
          $ref: "#/components/responses/APIError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    grupoOLXWebhookBasic:
      type: http
      scheme: basic
      description: CRM-wide Grupo OLX SECRET_KEY provisioned by the provider; never stored per tenant.
  headers:
    HealthCacheControl:
      description: Prevents caches from retaining health, readiness or release identity state.
      schema:
        type: string
        const: no-store
    VimobReleaseSha:
      description: Full immutable Git commit SHA for the running image, or the fail-closed local fallback.
      schema:
        $ref: "#/components/schemas/VimobReleaseSha"
    PropertyWorkspaceCacheControl:
      description: Prevents shared or browser caches from retaining role-aware workspace data.
      schema:
        type: string
        enum: ["private, no-store"]
    PropertyWorkspaceVary:
      description: Always includes Authorization and X-Organization-ID; middleware may also add Origin.
      schema:
        type: string
      example: Authorization, X-Organization-ID
  parameters:
    GrupoOLXWebhookToken:
      name: token
      in: path
      required: true
      description: Private per-integration path token. It is a credential and must never be logged.
      schema:
        type: string
        minLength: 32
        maxLength: 128
    OrganizationIdHeader:
      name: X-Organization-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Active organization when the user belongs to more than one organization.
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PropertyKeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PropertyAssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PropertyKeyIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque organization-scoped retry key for one semantic key movement.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    PropertyPublicationIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Organization-scoped retry key for one semantic publication command.
        Reuse with a different request payload returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    DevelopmentId:
      name: developmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DevelopmentUnitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DevelopmentPriceTableId:
      name: priceTableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DevelopmentReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Canonical UUID that makes reservation creation safe to retry with the same request.
      schema:
        type: string
        format: uuid
    DashboardDateFrom:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date-time
    DashboardDateTo:
      name: dateTo
      in: query
      schema:
        type: string
        format: date-time
    DashboardPipelineId:
      name: pipelineId
      in: query
      schema:
        type: string
        format: uuid
    DashboardTeamId:
      name: teamId
      in: query
      schema:
        type: string
        format: uuid
    DashboardUserId:
      name: userId
      in: query
      schema:
        type: string
        format: uuid
    DashboardSource:
      name: source
      in: query
      schema:
        type: string
    DashboardCampaignId:
      name: campaignId
      in: query
      schema:
        type: string
    DashboardAdSetId:
      name: adSetId
      in: query
      schema:
        type: string
    DashboardAdId:
      name: adId
      in: query
      schema:
        type: string
    DashboardTagId:
      name: tagId
      in: query
      schema:
        type: string
        format: uuid
    DashboardDealStatus:
      name: dealStatus
      in: query
      schema:
        type: string
        enum: [open, won, lost]
    DashboardSearchQuery:
      name: searchQuery
      in: query
      schema:
        type: string
  responses:
    APIError:
      description: Standard API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIErrorEnvelope"
  schemas:
    VimobReleaseSha:
      type: string
      pattern: "^(?:[0-9a-f]{40}|unversioned)$"
    HealthEnvelope:
      type: object
      additionalProperties: false
      required: [status, release]
      properties:
        status:
          type: string
          enum: [ok, ready]
        release:
          $ref: "#/components/schemas/VimobReleaseSha"
        runtime:
          type: object
          additionalProperties: true
    APIErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
    HomeFocusItem:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - obligation_key
        - lead_id
        - lead_name
        - title
        - description
        - due_at
        - status
        - tone
        - target_url
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [attention, task]
        obligation_key:
          type: string
        lead_id:
          type: string
          format: uuid
        lead_name:
          type: string
        title:
          type: string
        description:
          type: string
        due_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [due, warning, breached]
        tone:
          type: string
          enum: [critical, warning, neutral]
        policy_type:
          type: [string, "null"]
          enum:
            - unassigned
            - first_contact
            - first_effective_contact
            - stage_inactivity
            - stage_age
            - cadence_task
            - null
        task_type:
          type: [string, "null"]
        target_url:
          type: string
          pattern: "^/"
        stage_id:
          type: [string, "null"]
          format: uuid
        stage_name:
          type: [string, "null"]
    HomeFocusListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/HomeFocusItem"
    CadenceTaskTemplate:
      type: object
      additionalProperties: false
      required:
        - id
        - cadence_template_id
        - day_offset
        - title
        - description
        - position
        - type
        - observation
        - recommended_message
      properties:
        id:
          type: string
          format: uuid
        cadence_template_id:
          type: string
          format: uuid
        day_offset:
          type: integer
          description: >-
            Whole-day offset used by the compatibility template editor.
            Historical records can contain a negative value; mutation requests
            only accept zero or greater.
        title:
          type: string
          minLength: 1
        description:
          type: [string, "null"]
        position:
          type: [integer, "null"]
        type:
          type: [string, "null"]
        observation:
          type: [string, "null"]
        recommended_message:
          type: [string, "null"]
    CadenceTemplate:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - pipeline_id
        - stage_id
        - stage_key
        - name
        - is_active
        - created_at
        - tasks
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        pipeline_id:
          type: [string, "null"]
          format: uuid
        stage_id:
          type: [string, "null"]
          format: uuid
        stage_key:
          type: [string, "null"]
        name:
          type: string
          minLength: 1
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/CadenceTaskTemplate"
    CadenceTemplateListEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CadenceTemplate"
    CreateCadenceTaskRequest:
      type: object
      additionalProperties: false
      required: [cadence_template_id, day_offset, type, title]
      properties:
        cadence_template_id:
          type: string
          format: uuid
        day_offset:
          type: integer
          minimum: 0
        type:
          type: string
          enum: [call, message, email, note]
        title:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: [string, "null"]
          maxLength: 2000
        observation:
          type: [string, "null"]
          maxLength: 2000
        recommended_message:
          type: [string, "null"]
